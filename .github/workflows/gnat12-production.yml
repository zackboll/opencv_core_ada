name: GNAT 12 native production
on:
  push:
    branches: [main, 'feature/**', 'corrective/**']
  pull_request:
  workflow_dispatch:
jobs:
  native-debian12:
    runs-on: ubuntu-24.04
    container: debian:12
    steps:
      - name: Install native compiler, matching runtime and OpenCV
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl unzip git gnat-12 gprbuild g++ libopencv-dev pkg-config
          test -s /etc/ssl/certs/ca-certificates.crt
          test "$(gcc -dumpfullversion)" = 12.2.0
          test "$(gcc -print-file-name=adalib)" = /usr/lib/gcc/x86_64-linux-gnu/12/adalib
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Retrieve test-only AUnit sources without selecting a compiler
        run: |
          curl --fail --location --output /tmp/alire.zip https://github.com/alire-project/alire/releases/download/v2.1.1/alr-2.1.1-bin-x86_64-linux.zip
          unzip /tmp/alire.zip -d /tmp/alire
          install -m 0755 /tmp/alire/bin/alr /usr/local/bin/alr
          mkdir -p /tmp/aunit-source
          cd /tmp/aunit-source
          alr -n get --only aunit=26.0.0
      - name: Compile and execute actual GNAT 12 production
        run: |
          export GNAT12_WORK=/tmp/gnat12-qualified
          export GNAT12_AUNIT_ROOT=$(find /tmp/aunit-source -mindepth 1 -maxdepth 1 -type d -name 'aunit_*')
          sh tests/gnat12/run_production.sh
      - name: Preserve production and runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gnat12-native-production
          path: |
            /tmp/gnat12-qualified/logs/
            /tmp/gnat12-qualified/consumers/*.log
          if-no-files-found: error