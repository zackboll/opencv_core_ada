name: OpenCV Compatibility

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: OpenCV 4.1
            container_dir: containers/debian12-opencv-4.1
            image: opencv-core-ci-4.1

          - name: OpenCV 4.6
            container_dir: containers/debian12-opencv-4.6
            image: opencv-core-ci-4.6

          - name: OpenCV 4.10
            container_dir: containers/debian13-opencv-4.10
            image: opencv-core-ci-4.10

          - name: OpenCV 5.0
            container_dir: containers/debian13-opencv-5.0
            image: opencv-core-ci-5.0

    name: ${{ matrix.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Alire dependencies
        uses: actions/cache@v4
        with:
          path: |
            .ci-cache/alire/releases
            .ci-cache/alire/builds
          key: alire-${{ matrix.image }}-${{ hashFiles('tests/alire.toml', 'tests/alire.lock') }}
          restore-keys: |
            alire-${{ matrix.image }}-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build compatibility image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.container_dir }}
          file: ${{ matrix.container_dir }}/Dockerfile
          load: true
          tags: ${{ matrix.image }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Verify OpenCV version
        run: |
          docker run --rm "${{ matrix.image }}" sh -c \
            'pkg-config --modversion opencv5 2>/dev/null || pkg-config --modversion opencv4 2>/dev/null || pkg-config --modversion opencv'

      - name: Run test suite
        run: |
          mkdir -p .ci-cache/alire/releases
          mkdir -p .ci-cache/alire/builds

          docker run --rm \
            -v "$PWD:/workspace" \
            -v "$PWD/.ci-cache/alire/releases:/root/.cache/alire/releases" \
            -v "$PWD/.ci-cache/alire/builds:/root/.cache/alire/builds" \
            -w /workspace \
            "${{ matrix.image }}" \
            alr -C tests run

  ubuntu-arm64:
    name: OpenCV Ubuntu 24.04 ARM64
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install OpenCV Core and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
          build-essential \
          ca-certificates \
          curl \
          git \
          libopencv-dev \
          pkg-config \
          unzip

      - name: Report architecture and OpenCV version
        run: |
          uname -m
          pkg-config --modversion opencv5 2>/dev/null || \
          pkg-config --modversion opencv4 2>/dev/null || \
          pkg-config --modversion opencv

      - name: Install Alire
        env:
          ALIRE_VERSION: "2.1.1"
        run: |
          curl -L \
            -o /tmp/alire.zip \
            "https://github.com/alire-project/alire/releases/download/v${ALIRE_VERSION}/alr-${ALIRE_VERSION}-bin-aarch64-linux.zip"
          unzip /tmp/alire.zip -d /tmp/alire
          sudo install -m 0755 /tmp/alire/bin/alr /usr/local/bin/alr
          rm -rf /tmp/alire /tmp/alire.zip
          alr --version

      - name: Select Ada toolchain
        run: |
          alr -n --force toolchain --select \
            gnat_native=16.1.0 \
            gprbuild=26.0.1
          alr toolchain

      - name: Run test suite
        run: alr -C tests run

  alire-ubuntu-lts:
    name: Alire Ubuntu LTS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Alire
        env:
          ALIRE_VERSION: "2.1.1"
        run: |
          curl -L \
            -o /tmp/alire.zip \
            "https://github.com/alire-project/alire/releases/download/v${ALIRE_VERSION}/alr-${ALIRE_VERSION}-bin-x86_64-linux.zip"
          unzip /tmp/alire.zip -d /tmp/alire
          mkdir -p "$PWD/alire_install/bin"
          install -m 0755 /tmp/alire/bin/alr "$PWD/alire_install/bin/alr"
          rm -rf /tmp/alire /tmp/alire.zip
          "$PWD/alire_install/bin/alr" version

      - name: Pull Alire Ubuntu LTS image
        run: docker pull ghcr.io/alire-project/docker/gnat:ubuntu-lts

      - name: Run test suite in Alire Ubuntu LTS image
        run: |
          docker run --rm \
            -e DEBIAN_FRONTEND=noninteractive \
            -v "$PWD:/workspace" \
            -v "$PWD/alire_install/bin/alr:/usr/bin/alr:ro" \
            -w /workspace \
            ghcr.io/alire-project/docker/gnat:ubuntu-lts \
            /bin/bash -c '
              set -eu

              echo "=== Environment ==="
              cat /etc/os-release
              uname -a
              uname -m

              gcc --version || true
              g++ --version || true
              gnat --version || true
              gprbuild --version || true
              pkg-config --version || echo "pkg-config is not installed yet"

              echo "=== Alire ==="
              command -v alr
              alr version

              echo "=== Install OpenCV development package ==="
              apt-get update
              apt-get install -y --no-install-recommends \
                libopencv-dev \
                pkg-config

              echo "=== OpenCV pkg-config ==="
              pkg-config --version
              if pkg-config --exists opencv5; then
                opencv_pkg=opencv5
              elif pkg-config --exists opencv4; then
                opencv_pkg=opencv4
              elif pkg-config --exists opencv; then
                opencv_pkg=opencv
              else
                echo "error: no OpenCV pkg-config package found" >&2
                exit 1
              fi
              echo "OpenCV pkg-config package: ${opencv_pkg}"
              pkg-config --modversion "${opencv_pkg}"
              pkg-config --cflags "${opencv_pkg}"
              pkg-config --libs "${opencv_pkg}"

              echo "=== Select Alire toolchain ==="
              alr -n --force toolchain --select \
                gnat_native=16.1.0 \
                gprbuild=26.0.1
              alr toolchain

              echo "=== Compiler visible inside Alire environment ==="
              alr exec -- which gnat
              alr exec -- gnat --version
              alr exec -- which gprbuild
              alr exec -- gprbuild --version

              echo "=== Build and test ==="
              alr -n build
              alr -n -C tests run
            '

  alire-fedora-latest:
    name: Alire Fedora Latest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Alire
        env:
          ALIRE_VERSION: "2.1.1"
        run: |
          curl -L \
            -o /tmp/alire.zip \
            "https://github.com/alire-project/alire/releases/download/v${ALIRE_VERSION}/alr-${ALIRE_VERSION}-bin-x86_64-linux.zip"
          unzip /tmp/alire.zip -d /tmp/alire
          mkdir -p "$PWD/alire_install/bin"
          install -m 0755 /tmp/alire/bin/alr "$PWD/alire_install/bin/alr"
          rm -rf /tmp/alire /tmp/alire.zip
          "$PWD/alire_install/bin/alr" version

      - name: Pull Alire Fedora Latest image
        run: docker pull ghcr.io/alire-project/docker/gnat:fedora-latest

      - name: Run test suite in Alire Fedora Latest image
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -v "$PWD/alire_install/bin/alr:/usr/bin/alr:ro" \
            -w /workspace \
            ghcr.io/alire-project/docker/gnat:fedora-latest \
            /bin/bash -c '
              set -eu

              git config --global --add safe.directory /workspace

              echo "=== Source being tested ==="
              git rev-parse HEAD
              git log -1 --oneline
              grep -n -A5 -B2 "Library_Type" opencv_core.gpr

              echo "=== Environment ==="
              cat /etc/os-release
              uname -a
              uname -m

              gcc --version || true
              g++ --version || true
              gnat --version || true
              gprbuild --version || true

              echo "=== Alire ==="
              command -v alr
              alr version

              echo "=== Install OpenCV development package ==="
              dnf install -y \
                opencv-devel \
                pkgconf-pkg-config \
                git

              echo "=== OpenCV pkg-config ==="
              pkg-config --version
              if pkg-config --exists opencv5; then
                opencv_pkg=opencv5
              elif pkg-config --exists opencv4; then
                opencv_pkg=opencv4
              elif pkg-config --exists opencv; then
                opencv_pkg=opencv
              else
                echo "error: no OpenCV pkg-config package found" >&2
                exit 1
              fi
              echo "OpenCV pkg-config package: ${opencv_pkg}"
              pkg-config --modversion "${opencv_pkg}"
              pkg-config --cflags "${opencv_pkg}"
              pkg-config --libs "${opencv_pkg}"

              echo "=== Select Alire toolchain ==="
              alr -n --force toolchain --select \
                gnat_native=16.1.0 \
                gprbuild=26.0.1
              alr toolchain

              echo "=== Compiler visible inside Alire environment ==="
              alr exec -- which gnat
              alr exec -- gnat --version
              alr exec -- which gprbuild
              alr exec -- gprbuild --version

              echo "=== Build ==="
              alr -n build

              echo "=== PIC diagnostic ==="
              shim_obj=$(find . -name opencv_core_shim.o | head -n 1 || true)
              if [ -n "${shim_obj}" ]; then
                echo "Found: ${shim_obj}"
                file "${shim_obj}"
                readelf -h "${shim_obj}" | grep -E "Class:|Data:|Type:|Machine:" || true
                readelf -rW "${shim_obj}" | grep -E "R_X86_64_32|R_X86_64_32S|R_X86_64_PC32" || true
              else
                echo "opencv_core_shim.o not found"
              fi

              echo "=== Test ==="
              alr -n -C tests run
            '

  macos-arm64:
    name: OpenCV macOS ARM64
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Report source and runner
        run: |
          set -eu
          echo "=== Source being tested ==="
          git rev-parse HEAD
          git log -1 --oneline
          echo "=== Runner ==="
          uname -a
          uname -m
          sw_vers

      - name: Set up Alire
        uses: alire-project/setup-alire@latest
        with:
          version: "2.1.1"
          toolchain: "gnat_native gprbuild"

      - name: Select and prove Ada toolchain
        run: |
          set -eu
          alr -n --force toolchain --select \
            gnat_native=16.1.0 \
            gprbuild=26.0.1

          echo "=== Alire ==="
          alr version
          alr toolchain

          echo "=== Compiler visible inside Alire environment ==="
          alr exec -- which gnat
          alr exec -- gnat --version
          alr exec -- which gprbuild
          alr exec -- gprbuild --version

          echo "=== C++ compiler inside Alire environment ==="
          alr exec -- which g++ || true
          alr exec -- g++ --version || true

          echo "=== Apple clang++ ==="
          xcrun --find clang++ || true
          xcrun clang++ --version || true

      - name: Install Homebrew OpenCV
        run: |
          set -eu
          brew install opencv

          echo "=== Homebrew prefixes ==="
          brew --prefix
          brew --prefix opencv

          echo "=== Homebrew OpenCV info ==="
          brew info opencv

      - name: Report Homebrew OpenCV and pkg-config
        run: |
          set -eu
          opencv_prefix="$(brew --prefix opencv)"
          brew_pkgconfig="$(brew --prefix)/lib/pkgconfig"
          opencv_pkgconfig="${opencv_prefix}/lib/pkgconfig"

          if [ -d "${brew_pkgconfig}" ]; then
            export PKG_CONFIG_PATH="${brew_pkgconfig}${PKG_CONFIG_PATH:+:${PKG_CONFIG_PATH}}"
          fi
          if [ -d "${opencv_pkgconfig}" ]; then
            export PKG_CONFIG_PATH="${opencv_pkgconfig}${PKG_CONFIG_PATH:+:${PKG_CONFIG_PATH}}"
          fi

          echo "PKG_CONFIG_PATH=${PKG_CONFIG_PATH:-}"
          echo "PKG_CONFIG_PATH=${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"

          echo "=== pkg-config ==="
          pkg-config --version

          if pkg-config --exists opencv5; then
            opencv_pkg=opencv5
          elif pkg-config --exists opencv4; then
            opencv_pkg=opencv4
          elif pkg-config --exists opencv; then
            opencv_pkg=opencv
          else
            echo "error: no OpenCV pkg-config package found" >&2
            echo "tried opencv5, opencv4, opencv" >&2
            pkg-config --list-all | grep -i opencv || true
            exit 1
          fi

          echo "selected OpenCV pkg-config package: ${opencv_pkg}"
          echo "OPENCV_PKG=${opencv_pkg}" >> "$GITHUB_ENV"
          pkg-config --modversion "${opencv_pkg}"
          pkg-config --cflags "${opencv_pkg}"
          pkg-config --libs "${opencv_pkg}"

          echo "=== Homebrew OpenCV libraries ==="
          ls -l "${opencv_prefix}/lib"

      - name: Build current source
        id: root-build
        run: |
          set -eu
          alr -n build

      - name: Run test suite
        id: tests
        if: ${{ always() && steps.root-build.outcome == 'success' }}
        run: alr -n -C tests run

      - name: Verify shim library architecture
        if: ${{ always() && steps.root-build.outcome == 'success' }}
        run: |
          set -eu
          echo "=== Ada archive must not contain the C++ shim ==="
          if [ ! -f lib/libopencv_core_ada.a ]; then
            echo "error: lib/libopencv_core_ada.a is missing" >&2
            exit 1
          fi
          shim_count=$(ar -t lib/libopencv_core_ada.a | grep -c '^opencv_core_shim\.o$' || true)
          echo "opencv_core_shim.o count in libopencv_core_ada.a=${shim_count}"
          if [ "${shim_count}" -ne 0 ]; then
            echo "error: libopencv_core_ada.a still contains opencv_core_shim.o" >&2
            ar -t lib/libopencv_core_ada.a
            exit 1
          fi

          echo "=== Production shim dylib ==="
          shim_dylib=""
          for candidate in lib/libopencv_core_shim.dylib lib/libopencv_core_shim.*.dylib; do
            if [ -e "${candidate}" ]; then
              shim_dylib="${candidate}"
              break
            fi
          done
          if [ -z "${shim_dylib}" ]; then
            echo "error: production libopencv_core_shim*.dylib is missing" >&2
            ls -l lib
            exit 1
          fi
          echo "Found: ${shim_dylib}"
          otool -L "${shim_dylib}"

          echo "=== Shim dylib must use OpenCV and libc++, not libstdc++ ==="
          otool -L "${shim_dylib}" | grep -E 'libopencv_core'
          otool -L "${shim_dylib}" | grep -E 'libc\+\+'
          if otool -L "${shim_dylib}" | grep -E 'libstdc\+\+'; then
            echo "error: shim dylib depends on libstdc++" >&2
            exit 1
          fi

          echo "=== Shim dylib exports opencv_core_mat_reshape ==="
          nm -gU "${shim_dylib}" | grep opencv_core_mat_reshape

          echo "=== Test executable depends on production shim dylib ==="
          test_exe="tests/bin/tests"
          if [ ! -e "${test_exe}" ]; then
            echo "error: ${test_exe} is missing" >&2
            ls -l tests/bin
            exit 1
          fi
          otool -L "${test_exe}"
          otool -L "${test_exe}" | grep libopencv_core_shim
          if otool -L "${test_exe}" | grep -E 'libopencv_core_shim_diag|libopencv_core_shim_ada_diag'; then
            echo "error: test executable depends on a diagnostic shim dylib" >&2
            exit 1
          fi

  macos-arm64-macports:
    name: OpenCV macOS ARM64 (MacPorts)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Report source and runner
        run: |
          set -eu
          echo "=== Source being tested ==="
          git rev-parse HEAD
          git log -1 --oneline
          echo "=== Runner ==="
          uname -a
          uname -m
          sw_vers

      - name: Set up Alire
        uses: alire-project/setup-alire@latest
        with:
          version: "2.1.1"
          toolchain: "gnat_native gprbuild"

      - name: Select and prove Ada toolchain
        run: |
          set -eu
          alr -n --force toolchain --select \
            gnat_native=16.1.0 \
            gprbuild=26.0.1

          echo "=== Alire ==="
          alr version
          alr toolchain

          echo "=== Compiler visible inside Alire environment ==="
          alr exec -- which gnat
          alr exec -- gnat --version
          alr exec -- which gprbuild
          alr exec -- gprbuild --version

          echo "=== C++ compiler inside Alire environment ==="
          alr exec -- which g++ || true
          alr exec -- g++ --version || true

          echo "=== Apple clang++ ==="
          xcrun --find clang++ || true
          xcrun clang++ --version || true

      - name: Disable Homebrew
        run: rm -f $(which brew)
        shell: bash

      - name: Set up MacPorts
        uses: melusina-org/setup-macports@v1

      - name: Configure MacPorts for Quartz
        run: |
          set -eu
          echo '-x11 +no_x11 +quartz' >> /opt/local/etc/macports/variants.conf
          cat /opt/local/etc/macports/variants.conf

      - name: Verify Alire detects MacPorts
        run: |
          set -eu
          echo "=== Alire platform ==="
          alr version
          if ! alr version | grep -q 'distribution:[[:space:]]*MACPORTS'; then
            echo "error: Alire did not report distribution: MACPORTS" >&2
            exit 1
          fi

      - name: Install MacPorts OpenCV
        run: |
          set -eu
          sudo port -N install opencv4

      - name: Report MacPorts OpenCV and pkg-config
        run: |
          set -eu
          echo "=== MacPorts ==="
          port version
          port installed opencv4

          echo "=== pkg-config ==="
          command -v pkg-config
          pkg-config --version

          echo "=== MacPorts opencv4 pkg-config files ==="
          port contents opencv4 | grep -E 'pkgconfig|\.pc$' || true

          echo "PKG_CONFIG_PATH is not exported by this job"
          echo "PKG_CONFIG_PATH=${PKG_CONFIG_PATH:-<unset>}"

      - name: Build current source
        id: root-build
        run: |
          set -eu
          unset PKG_CONFIG_PATH
          echo "PKG_CONFIG_PATH=${PKG_CONFIG_PATH:-<unset>}"
          alr -n build

      - name: Verify generated OpenCV configuration
        if: ${{ always() && steps.root-build.outcome == 'success' }}
        run: |
          set -eu
          echo "=== Generated config/opencv_core_install.gpr ==="
          cat config/opencv_core_install.gpr

          if ! grep -F '/opt/local/include/opencv4' config/opencv_core_install.gpr; then
            echo "error: generated GPR did not select MacPorts include path" >&2
            exit 1
          fi
          if ! grep -F '/opt/local/lib/opencv4' config/opencv_core_install.gpr; then
            echo "error: generated GPR did not select MacPorts library path" >&2
            exit 1
          fi
          if ! grep -F 'Use_Apple_Clang : Apple_Clang_Kind := "True";' config/opencv_core_install.gpr; then
            echo "error: generated GPR did not enable Apple clang++" >&2
            exit 1
          fi

      - name: Run test suite
        id: tests
        if: ${{ always() && steps.root-build.outcome == 'success' }}
        run: |
          set -eu
          unset PKG_CONFIG_PATH
          echo "PKG_CONFIG_PATH=${PKG_CONFIG_PATH:-<unset>}"
          alr -n -C tests run

      - name: Verify shim library architecture
        if: ${{ always() && steps.root-build.outcome == 'success' }}
        run: |
          set -eu
          echo "=== Ada archive must not contain the C++ shim ==="
          if [ ! -f lib/libopencv_core_ada.a ]; then
            echo "error: lib/libopencv_core_ada.a is missing" >&2
            exit 1
          fi
          shim_count=$(ar -t lib/libopencv_core_ada.a | grep -c '^opencv_core_shim\.o$' || true)
          echo "opencv_core_shim.o count in libopencv_core_ada.a=${shim_count}"
          if [ "${shim_count}" -ne 0 ]; then
            echo "error: libopencv_core_ada.a still contains opencv_core_shim.o" >&2
            ar -t lib/libopencv_core_ada.a
            exit 1
          fi

          echo "=== Production shim dylib ==="
          shim_dylib=""
          for candidate in lib/libopencv_core_shim.dylib lib/libopencv_core_shim.*.dylib; do
            if [ -e "${candidate}" ]; then
              shim_dylib="${candidate}"
              break
            fi
          done
          if [ -z "${shim_dylib}" ]; then
            echo "error: production libopencv_core_shim*.dylib is missing" >&2
            ls -l lib
            exit 1
          fi
          echo "Found: ${shim_dylib}"
          otool -L "${shim_dylib}"

          echo "=== Shim dylib must use MacPorts OpenCV and libc++, not Homebrew or libstdc++ ==="
          otool -L "${shim_dylib}" | grep -E '/opt/local/lib/opencv4/libopencv_core'
          otool -L "${shim_dylib}" | grep -F '/usr/lib/libc++.1.dylib'
          if otool -L "${shim_dylib}" | grep -E '/opt/homebrew'; then
            echo "error: shim dylib depends on Homebrew" >&2
            exit 1
          fi
          if otool -L "${shim_dylib}" | grep -E 'libstdc\+\+'; then
            echo "error: shim dylib depends on libstdc++" >&2
            exit 1
          fi

          echo "=== Test executable depends on production shim dylib ==="
          test_exe="tests/bin/tests"
          if [ ! -e "${test_exe}" ]; then
            echo "error: ${test_exe} is missing" >&2
            ls -l tests/bin
            exit 1
          fi
          otool -L "${test_exe}"
          otool -L "${test_exe}" | grep libopencv_core_shim
          if otool -L "${test_exe}" | grep -E 'libopencv_core_shim_diag|libopencv_core_shim_ada_diag'; then
            echo "error: test executable depends on a diagnostic shim dylib" >&2
            exit 1
          fi


  windows-x86_64-msys2:
    name: OpenCV Windows x86_64 (MSYS2)
    runs-on: windows-latest
    env:
      TESTS_WINDOWS_STATIC_ADA_RUNTIME: "True"

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Report source and runner
        run: |
          set -eu
          echo "=== Source being tested ==="
          git rev-parse HEAD
          git log -1 --oneline
          echo "=== Runner ==="
          uname -a
          uname -s
          uname -m

      - name: Set up Alire
        uses: alire-project/setup-alire@latest
        with:
          version: "2.1.1"
          toolchain: "gnat_native gprbuild"
          msys2: true

      - name: Select and prove Ada toolchain
        run: |
          set -eu
          alr -n --force toolchain --select \
            gnat_native=16.1.0 \
            gprbuild=26.0.1

          echo "=== Alire ==="
          alr version
          alr toolchain

          echo "=== Platform detection ==="
          uname -a
          uname -s
          uname -m

          if ! alr version | grep -qi 'distribution:[[:space:]]*MSYS2'; then
            echo "error: Alire did not report distribution: MSYS2" >&2
            alr version
            exit 1
          fi
          if ! alr version | grep -qi 'host-arch:[[:space:]]*X86_64'; then
            echo "error: Alire did not report host-arch: X86_64" >&2
            alr version
            exit 1
          fi
          if ! alr version | grep -qi 'os:[[:space:]]*WINDOWS'; then
            echo "error: Alire did not report os: WINDOWS" >&2
            alr version
            exit 1
          fi

          echo "=== Compiler visible inside Alire environment ==="
          alr exec -- which gnat
          alr exec -- gnat --version
          alr exec -- which gprbuild
          alr exec -- gprbuild --version
          alr exec -- which g++ || true
          alr exec -- g++ --version || true

      - name: Verify Alire-managed MSYS2 pacman
        run: |
          set -eu
          echo "=== pacman ==="
          pacman_path=$(alr exec -- which pacman)
          echo "pacman=${pacman_path}"
          pacman_win=$(alr exec -- sh -c 'cygpath -w "$(which pacman)"' || true)
          echo "pacman Windows path=${pacman_win:-<unavailable>}"
          pacman_path_norm=$(printf '%s' "${pacman_win:-${pacman_path}}" | tr '\\' '/' | tr '[:upper:]' '[:lower:]')
          case "${pacman_path_norm}" in
            *alire*/*msys64*|*msys64*pacman*|/usr/bin/pacman*)
              echo "pacman resolves to the Alire-managed MSYS2 installation"
              ;;
            *)
              echo "error: pacman is not the Alire-managed MSYS2 pacman: ${pacman_path}" >&2
              alr exec -- which pacman || true
              alr settings --global || true
              exit 1
              ;;
          esac
          alr exec -- pacman --version

      - name: Install OpenCV through Alire MSYS2
        run: |
          set -eu
          alr exec -- pacman -Sy --noconfirm --needed \
            mingw-w64-x86_64-opencv \
            mingw-w64-x86_64-pkg-config

          echo "=== Installed MSYS2 packages ==="
          alr exec -- pacman -Q mingw-w64-x86_64-opencv mingw-w64-x86_64-pkg-config

      - name: Demonstrate pkg-config collision
        run: |
          set -eu
          echo "=== Generic pkg-config (may be Strawberry Perl) ==="
          command -v pkg-config || true
          where.exe pkg-config || true

          echo "=== Target-prefixed MinGW pkg-config ==="
          prefixed=$(alr exec -- which x86_64-w64-mingw32-pkg-config)
          echo "x86_64-w64-mingw32-pkg-config=${prefixed}"
          where.exe x86_64-w64-mingw32-pkg-config || true

          prefixed_win=$(alr exec -- sh -c 'cygpath -w "$(which x86_64-w64-mingw32-pkg-config)"' || true)
          echo "prefixed Windows path=${prefixed_win:-<unavailable>}"
          prefixed_norm=$(printf '%s' "${prefixed_win:-${prefixed}}" | tr '\\' '/' | tr '[:upper:]' '[:lower:]')
          case "${prefixed_norm}" in
            *msys64*mingw64*|*mingw64/bin/x86_64-w64-mingw32-pkg-config*)
              echo "target-prefixed pkg-config resolves to the MinGW64 tree"
              ;;
            *)
              echo "error: x86_64-w64-mingw32-pkg-config is not the Alire MSYS2 MinGW64 executable: ${prefixed}" >&2
              exit 1
              ;;
          esac

      - name: Verify OpenCV pkg-config metadata
        run: |
          set -eu
          echo "=== OpenCV pkg-config metadata installed by MSYS2 ==="
          alr exec -- pacman -Ql mingw-w64-x86_64-opencv | grep '/lib/pkgconfig/opencv5\.pc$'

          echo "=== x86_64-w64-mingw32-pkg-config opencv5 ==="
          alr exec -- x86_64-w64-mingw32-pkg-config --exists opencv5
          alr exec -- x86_64-w64-mingw32-pkg-config --modversion opencv5
          alr exec -- x86_64-w64-mingw32-pkg-config --cflags opencv5
          alr exec -- x86_64-w64-mingw32-pkg-config --libs opencv5

          echo "PKG_CONFIG=${PKG_CONFIG:-<unset>}"
          echo "PKG_CONFIG_PATH=${PKG_CONFIG_PATH:-<unset>}"

      - name: Build current source
        id: root-build
        run: |
          set -eu
          echo "PKG_CONFIG=${PKG_CONFIG:-<unset>}"
          echo "PKG_CONFIG_PATH=${PKG_CONFIG_PATH:-<unset>}"
          alr -n build

      - name: Verify generated OpenCV configuration
        if: ${{ always() && steps.root-build.outcome == 'success' }}
        run: |
          set -eu
          echo "=== Generated config/opencv_core_install.gpr ==="
          cat config/opencv_core_install.gpr

          if ! grep -F 'Use_Apple_Clang : Apple_Clang_Kind := "False";' config/opencv_core_install.gpr; then
            echo "error: generated GPR did not keep Use_Apple_Clang False" >&2
            exit 1
          fi
          if ! grep -F 'Cxx_Driver := "g++";' config/opencv_core_install.gpr; then
            echo "error: generated GPR did not select g++" >&2
            exit 1
          fi
          if ! grep -F 'Cxx_Runtime_Switch := "-lstdc++";' config/opencv_core_install.gpr; then
            echo "error: generated GPR did not select -lstdc++" >&2
            exit 1
          fi
          if ! grep -F 'Use_Direct_OpenCV_Link : Direct_OpenCV_Link_Kind := "True";' config/opencv_core_install.gpr; then
            echo "error: generated GPR did not enable direct OpenCV Core linking" >&2
            exit 1
          fi
          if ! grep -F 'Use_Windows_Shared_Shim : Windows_Shared_Shim_Kind := "True";' config/opencv_core_install.gpr; then
            echo "error: generated GPR did not enable the Windows shared shim" >&2
            exit 1
          fi
          if ! grep -E 'OpenCV_Core_Link_Option := "[^"]*mingw64[/\\]lib[/\\]libopencv_core\.dll\.a";' config/opencv_core_install.gpr; then
            echo "error: generated GPR did not select the MinGW64 OpenCV Core import library" >&2
            exit 1
          fi
          if ! grep -E 'mingw64' config/opencv_core_install.gpr; then
            echo "error: generated GPR did not point at the MinGW64 OpenCV installation" >&2
            exit 1
          fi
          if ! grep -E 'include[/\\]opencv5' config/opencv_core_install.gpr; then
            echo "error: generated GPR did not select mingw64/include/opencv5" >&2
            exit 1
          fi
          if ! grep -E 'Library_Search_Switch := "-L[^"]*mingw64[^"]*lib' config/opencv_core_install.gpr; then
            echo "error: generated GPR did not select mingw64/lib" >&2
            exit 1
          fi

          import_library=$(sed -n 's/.*OpenCV_Core_Link_Option := "\(.*\)";/\1/p' config/opencv_core_install.gpr)
          echo "OpenCV_Core_Link_Option=${import_library}"
          if [ ! -f "${import_library}" ]; then
            echo "error: generated OpenCV Core import library does not exist: ${import_library}" >&2
            alr exec -- pacman -Ql mingw-w64-x86_64-opencv | grep 'libopencv_core\.dll\.a$' || true
            exit 1
          fi
          echo "=== OpenCV Core import library ==="
          ls -l "${import_library}"
          alr exec -- pacman -Ql mingw-w64-x86_64-opencv | grep 'libopencv_core\.dll\.a$'

      - name: Verify shim library architecture
        if: ${{ always() && steps.root-build.outcome == 'success' }}
        run: |
          set -eu
          echo "=== Production shim artifacts ==="
          ls -l lib || true

          shim_dll=""
          for candidate in lib/libopencv_core_shim.dll lib/opencv_core_shim.dll; do
            if [ -f "${candidate}" ]; then
              shim_dll="${candidate}"
              break
            fi
          done
          if [ -z "${shim_dll}" ]; then
            echo "error: production opencv_core_shim DLL is missing" >&2
            ls -l lib || true
            exit 1
          fi
          echo "Found shim DLL: ${shim_dll}"
          ls -l "${shim_dll}"

          if [ -f lib/libopencv_core_shim.a ]; then
            echo "error: Windows production shim is still a static archive" >&2
            exit 1
          fi

          echo "=== Ada archive must not contain the C++ shim ==="
          if [ ! -f lib/libopencv_core_ada.a ]; then
            echo "error: lib/libopencv_core_ada.a is missing" >&2
            ls -l lib || true
            exit 1
          fi
          shim_count=$(alr exec -- ar -t lib/libopencv_core_ada.a | grep -c '^opencv_core_shim\.o$' || true)
          echo "opencv_core_shim.o count in libopencv_core_ada.a=${shim_count}"
          if [ "${shim_count}" -ne 0 ]; then
            echo "error: libopencv_core_ada.a still contains opencv_core_shim.o" >&2
            alr exec -- ar -t lib/libopencv_core_ada.a
            exit 1
          fi

          dump=""
          if alr exec -- which objdump >/dev/null 2>&1; then
            dump=objdump
          elif alr exec -- which x86_64-w64-mingw32-objdump >/dev/null 2>&1; then
            dump=x86_64-w64-mingw32-objdump
          fi
          if [ -z "${dump}" ]; then
            echo "error: objdump is required to inspect Windows PE dependencies" >&2
            exit 1
          fi
          echo "=== Shim DLL dependencies (${dump} -p) ==="
          alr exec -- "${dump}" -p "${shim_dll}" | grep -i 'DLL Name' || true
          if ! alr exec -- "${dump}" -p "${shim_dll}" | grep -qi 'libopencv_core-500.dll'; then
            echo "error: shim DLL does not reference libopencv_core-500.dll" >&2
            exit 1
          fi


      - name: Run test suite
        id: tests
        if: ${{ always() && steps.root-build.outcome == 'success' }}
        run: |
          set -eu
          echo "PKG_CONFIG=${PKG_CONFIG:-<unset>}"
          echo "PKG_CONFIG_PATH=${PKG_CONFIG_PATH:-<unset>}"
          echo "=== Alire execution PATH ==="
          alr_path=$(alr exec -- sh -c 'printf "%s" "$PATH"')
          printf '%s\n' "${alr_path}"
          if ! printf '%s' "${alr_path}" | grep -E '(^|[:;])[^:;]*[/\\]lib([:;]|$)'; then
            echo "error: Alire PATH does not expose the crate lib directory" >&2
            exit 1
          fi

          log="${RUNNER_TEMP:-$PWD}/opencv-core-windows-test-build.log"
          echo "TESTS_WINDOWS_STATIC_ADA_RUNTIME=${TESTS_WINDOWS_STATIC_ADA_RUNTIME:-<unset>}"
          if ! alr -n -C tests build -- -v -XTESTS_WINDOWS_STATIC_ADA_RUNTIME=True >"${log}" 2>&1; then
            echo "=== Test build failed ==="
            cat "${log}"
            exit 1
          fi
          echo "=== Final link command fragments ==="
          grep -E 'gcc(\.exe)? |g\+\+(\.exe)? |ld(\.exe)? |opencv_core_shim|libopencv_core\.dll\.a|-lstdc\+\+|-static-libgcc|-static-libstdc\+\+' "${log}" | tail -n 80

          # Extract the actual tests.exe link command. Do not treat the
          # separate libopencv_core_shim.dll link (-shared-libgcc -o ...) as
          # the final test executable link.
          link_cmd=$(grep -E -- '-o[[:space:]]*[^[:space:]]*tests\.exe([[:space:]]|$)' "${log}" | tail -n 1 || true)
          if [ -z "${link_cmd}" ]; then
            echo "error: could not extract the tests.exe link command" >&2
            exit 1
          fi
          echo "=== Final tests.exe link command ==="
          printf '%s\n' "${link_cmd}"

          if printf '%s\n' "${link_cmd}" | grep -E -- '-L[^[:space:]]*msys64[/\\]mingw64[/\\]lib([[:space:]]|$)'; then
            echo "error: tests.exe link still searches MSYS2 mingw64/lib" >&2
            exit 1
          fi
          if printf '%s\n' "${link_cmd}" | grep -F 'libopencv_core.dll.a'; then
            echo "error: tests.exe link still consumes OpenCV Core import library" >&2
            exit 1
          fi
          if printf '%s\n' "${link_cmd}" | grep -E '(^|[[:space:]])-lopencv_core([[:space:]]|$)'; then
            echo "error: tests.exe link still consumes OpenCV Core directly" >&2
            exit 1
          fi
          if printf '%s\n' "${link_cmd}" | grep -F 'libopencv_core_shim.a'; then
            echo "error: tests.exe link still consumes the static shim archive" >&2
            exit 1
          fi
          if ! printf '%s\n' "${link_cmd}" | grep -E '(^|[[:space:]])-lopencv_core_shim([[:space:]]|$)'; then
            echo "error: tests.exe link did not use shared shim linkage (-lopencv_core_shim)" >&2
            exit 1
          fi
          if printf '%s\n' "${link_cmd}" | grep -E '(^|[[:space:]])-lstdc\+\+([[:space:]]|$)'; then
            echo "error: tests.exe link still receives ordinary -lstdc++" >&2
            exit 1
          fi
          if printf '%s\n' "${link_cmd}" | grep -E -- '-shared-libgcc'; then
            echo "error: tests.exe link still contains -shared-libgcc" >&2
            exit 1
          fi
          if ! printf '%s\n' "${link_cmd}" | grep -E -- '-static-libgcc'; then
            echo "error: tests.exe link does not contain -static-libgcc" >&2
            exit 1
          fi
          if printf '%s\n' "${link_cmd}" | grep -E '(^|[[:space:]/\\])g\+\+(\.exe)?([[:space:]]|$)'; then
            echo "error: tests.exe is still linked with g++ rather than gcc" >&2
            exit 1
          fi
          if grep -E '_gnu_exception_handler|__mingw_oldexcpt_handler|__mingw_initltssuo_force|__mingw_initltsdyn_force|__mingw_initltsdrot_force' "${log}"; then
            echo "error: MinGW CRT unresolved symbols reappeared" >&2
            exit 1
          fi

          echo "=== Binder command fragments ==="
          grep -E 'gnatbind|gprbind|-static([[:space:]]|$)' "${log}" | tail -n 40 || true

          test_exe=""
          for candidate in tests/bin/tests.exe tests/bin/tests; do
            if [ -e "${candidate}" ]; then
              test_exe="${candidate}"
              break
            fi
          done
          if [ -z "${test_exe}" ]; then
            echo "error: ${test_exe:-tests/bin/tests.exe} is missing after the static-runtime link" >&2
            ls -l tests/bin || true
            exit 1
          fi

          dump=""
          if alr exec -- which objdump >/dev/null 2>&1; then
            dump=objdump
          elif alr exec -- which x86_64-w64-mingw32-objdump >/dev/null 2>&1; then
            dump=x86_64-w64-mingw32-objdump
          fi
          if [ -z "${dump}" ]; then
            echo "error: objdump is required to inspect Windows PE dependencies" >&2
            exit 1
          fi

          echo "=== tests.exe DLL dependencies before AUnit (${dump} -p) ==="
          deps=$(alr exec -- "${dump}" -p "${test_exe}" | grep -i 'DLL Name' || true)
          echo "${deps}"

          echo "=== Notable DLL imports ==="
          for name in libgcc_s_seh-1.dll libgnat-16.dll libgnarl-16.dll libstdc++-6.dll libopencv_core-500.dll libopencv_core_shim.dll; do
            if printf '%s\n' "${deps}" | grep -qi "${name}"; then
              echo "present: ${name}"
            else
              echo "absent: ${name}"
            fi
          done

          if ! printf '%s\n' "${deps}" | grep -qi 'opencv_core_shim'; then
            echo "error: test executable does not depend on the production shim DLL" >&2
            exit 1
          fi
          if printf '%s\n' "${deps}" | grep -qi 'libopencv_core-500.dll'; then
            echo "error: test executable still depends directly on OpenCV Core" >&2
            exit 1
          fi
          if printf '%s\n' "${deps}" | grep -qi 'libstdc++-6.dll'; then
            echo "error: test executable still imports libstdc++-6.dll" >&2
            exit 1
          fi
          if printf '%s\n' "${deps}" | grep -qi 'libgcc_s_seh-1.dll'; then
            echo "error: test executable still imports libgcc_s_seh-1.dll" >&2
            echo "static Ada/libgcc isolation did not take effect" >&2
            exit 1
          fi
          if printf '%s\n' "${deps}" | grep -qi 'libgnat-16.dll'; then
            echo "error: test executable still imports libgnat-16.dll" >&2
            exit 1
          fi
          if printf '%s\n' "${deps}" | grep -qi 'libgnarl-16.dll'; then
            echo "error: test executable still imports libgnarl-16.dll" >&2
            exit 1
          fi

          alr -n -C tests run --skip-build

      - name: Report Windows runtime diagnostics
        if: ${{ always() && steps.root-build.outcome == 'success' }}
        run: |
          set -eu
          test_exe=""
          for candidate in tests/bin/tests.exe tests/bin/tests; do
            if [ -e "${candidate}" ]; then
              test_exe="${candidate}"
              break
            fi
          done
          if [ -z "${test_exe}" ]; then
            echo "error: ${test_exe:-tests/bin/tests.exe} is missing" >&2
            ls -l tests/bin || true
            exit 1
          fi

          echo "=== Test executable ==="
          ls -l "${test_exe}"

          dump=""
          if alr exec -- which objdump >/dev/null 2>&1; then
            dump=objdump
          elif alr exec -- which x86_64-w64-mingw32-objdump >/dev/null 2>&1; then
            dump=x86_64-w64-mingw32-objdump
          fi
          if [ -z "${dump}" ]; then
            echo "error: objdump is required to inspect Windows PE dependencies" >&2
            exit 1
          fi

          echo "=== DLL dependencies (${dump} -p) ==="
          deps=$(alr exec -- "${dump}" -p "${test_exe}" | grep -i 'DLL Name' || true)
          echo "${deps}"

          echo "=== Notable DLL imports ==="
          for name in libgcc_s_seh-1.dll libgnat-16.dll libgnarl-16.dll libstdc++-6.dll libopencv_core-500.dll libopencv_core_shim.dll; do
            if printf '%s\n' "${deps}" | grep -qi "${name}"; then
              echo "present: ${name}"
            else
              echo "absent: ${name}"
            fi
          done

          if ! printf '%s\n' "${deps}" | grep -qi 'opencv_core_shim'; then
            echo "error: test executable does not depend on the production shim DLL" >&2
            exit 1
          fi
          if printf '%s\n' "${deps}" | grep -qi 'libopencv_core-500.dll'; then
            echo "error: test executable still depends directly on OpenCV Core" >&2
            exit 1
          fi
          if printf '%s\n' "${deps}" | grep -qi 'libstdc++-6.dll'; then
            echo "error: test executable still imports libstdc++-6.dll" >&2
            exit 1
          fi
          if printf '%s\n' "${deps}" | grep -qi 'libgcc_s_seh-1.dll'; then
            echo "error: test executable still imports libgcc_s_seh-1.dll" >&2
            exit 1
          fi
          if printf '%s\n' "${deps}" | grep -qi 'libgnat-16.dll'; then
            echo "error: test executable still imports libgnat-16.dll" >&2
            exit 1
          fi
          if printf '%s\n' "${deps}" | grep -qi 'libgnarl-16.dll'; then
            echo "error: test executable still imports libgnarl-16.dll" >&2
            exit 1
          fi


