name: OpenCV Compatibility

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: OpenCV 4.1
            container_dir: containers/debian12-opencv-4.1
            image: opencv-core-ci-4.1

          - name: OpenCV 4.6
            container_dir: containers/debian12-opencv-4.6
            image: opencv-core-ci-4.6

          - name: OpenCV 4.10
            container_dir: containers/debian13-opencv-4.10
            image: opencv-core-ci-4.10

          - name: OpenCV 5.0
            container_dir: containers/debian13-opencv-5.0
            image: opencv-core-ci-5.0

    name: ${{ matrix.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Alire dependencies
        uses: actions/cache@v4
        with:
          path: |
            .ci-cache/alire/releases
            .ci-cache/alire/builds
          key: alire-${{ matrix.image }}-${{ hashFiles('tests/alire.toml', 'tests/alire.lock') }}
          restore-keys: |
            alire-${{ matrix.image }}-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build compatibility image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.container_dir }}
          file: ${{ matrix.container_dir }}/Dockerfile
          load: true
          tags: ${{ matrix.image }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Verify OpenCV version
        run: |
          docker run --rm "${{ matrix.image }}" sh -c \
            'pkg-config --modversion opencv5 2>/dev/null || pkg-config --modversion opencv4 2>/dev/null || pkg-config --modversion opencv'

      - name: Run test suite
        run: |
          mkdir -p .ci-cache/alire/releases
          mkdir -p .ci-cache/alire/builds

          docker run --rm \
            -v "$PWD:/workspace" \
            -v "$PWD/.ci-cache/alire/releases:/root/.cache/alire/releases" \
            -v "$PWD/.ci-cache/alire/builds:/root/.cache/alire/builds" \
            -w /workspace \
            "${{ matrix.image }}" \
            alr -C tests run

  ubuntu-arm64:
    name: OpenCV Ubuntu 24.04 ARM64
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install OpenCV Core and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
          build-essential \
          ca-certificates \
          curl \
          git \
          libopencv-dev \
          pkg-config \
          unzip

      - name: Report architecture and OpenCV version
        run: |
          uname -m
          pkg-config --modversion opencv5 2>/dev/null || \
          pkg-config --modversion opencv4 2>/dev/null || \
          pkg-config --modversion opencv

      - name: Install Alire
        env:
          ALIRE_VERSION: "2.1.1"
        run: |
          curl -L \
            -o /tmp/alire.zip \
            "https://github.com/alire-project/alire/releases/download/v${ALIRE_VERSION}/alr-${ALIRE_VERSION}-bin-aarch64-linux.zip"
          unzip /tmp/alire.zip -d /tmp/alire
          sudo install -m 0755 /tmp/alire/bin/alr /usr/local/bin/alr
          rm -rf /tmp/alire /tmp/alire.zip
          alr --version

      - name: Select Ada toolchain
        run: |
          alr -n --force toolchain --select \
            gnat_native=16.1.0 \
            gprbuild=26.0.1
          alr toolchain

      - name: Run test suite
        run: alr -C tests run

  alire-ubuntu-lts:
    name: Alire Ubuntu LTS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Alire
        env:
          ALIRE_VERSION: "2.1.1"
        run: |
          curl -L \
            -o /tmp/alire.zip \
            "https://github.com/alire-project/alire/releases/download/v${ALIRE_VERSION}/alr-${ALIRE_VERSION}-bin-x86_64-linux.zip"
          unzip /tmp/alire.zip -d /tmp/alire
          mkdir -p "$PWD/alire_install/bin"
          install -m 0755 /tmp/alire/bin/alr "$PWD/alire_install/bin/alr"
          rm -rf /tmp/alire /tmp/alire.zip
          "$PWD/alire_install/bin/alr" version

      - name: Pull Alire Ubuntu LTS image
        run: docker pull ghcr.io/alire-project/docker/gnat:ubuntu-lts

      - name: Run test suite in Alire Ubuntu LTS image
        run: |
          docker run --rm \
            -e DEBIAN_FRONTEND=noninteractive \
            -v "$PWD:/workspace" \
            -v "$PWD/alire_install/bin/alr:/usr/bin/alr:ro" \
            -w /workspace \
            ghcr.io/alire-project/docker/gnat:ubuntu-lts \
            /bin/bash -c '
              set -eu

              echo "=== Environment ==="
              cat /etc/os-release
              uname -a
              uname -m

              gcc --version || true
              g++ --version || true
              gnat --version || true
              gprbuild --version || true
              pkg-config --version || echo "pkg-config is not installed yet"

              echo "=== Alire ==="
              command -v alr
              alr version

              echo "=== Install OpenCV development package ==="
              apt-get update
              apt-get install -y --no-install-recommends \
                libopencv-dev \
                pkg-config

              echo "=== OpenCV pkg-config ==="
              pkg-config --version
              if pkg-config --exists opencv5; then
                opencv_pkg=opencv5
              elif pkg-config --exists opencv4; then
                opencv_pkg=opencv4
              elif pkg-config --exists opencv; then
                opencv_pkg=opencv
              else
                echo "error: no OpenCV pkg-config package found" >&2
                exit 1
              fi
              echo "OpenCV pkg-config package: ${opencv_pkg}"
              pkg-config --modversion "${opencv_pkg}"
              pkg-config --cflags "${opencv_pkg}"
              pkg-config --libs "${opencv_pkg}"

              echo "=== Select Alire toolchain ==="
              alr -n --force toolchain --select \
                gnat_native=16.1.0 \
                gprbuild=26.0.1
              alr toolchain

              echo "=== Compiler visible inside Alire environment ==="
              alr exec -- which gnat
              alr exec -- gnat --version
              alr exec -- which gprbuild
              alr exec -- gprbuild --version

              echo "=== Build and test ==="
              alr -n build
              alr -n -C tests run
            '

  alire-fedora-latest:
    name: Alire Fedora Latest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout opencv_core_ada
        uses: actions/checkout@v4

      - name: Check out alire-index PR #2071 merge ref
        uses: actions/checkout@v4
        with:
          repository: alire-project/alire-index
          ref: refs/pull/2071/merge
          fetch-depth: 0
          path: alire-index

      - name: Check out alire-index-checks
        uses: actions/checkout@v4
        with:
          repository: alire-project/alire-index-checks
          ref: stable-1.4.0
          path: alire-index/alire-index-checks

      - name: Set up Alire 2.1.1
        uses: alire-project/setup-alire@latest
        with:
          version: 2.1.1
          toolchain: --disable-assistant

      - name: Diagnose Alire-index checkout
        working-directory: alire-index
        run: |
          set -eu
          echo "=== Alire-index git status ==="
          git status
          echo "=== Alire-index recent history ==="
          git log -3 --oneline --decorate
          echo "=== HEAD / HEAD~1 ==="
          git rev-parse HEAD
          git rev-parse HEAD~1
          echo "=== git diff --name-only HEAD~1 ==="
          git diff --name-only HEAD~1
          echo "=== opencv_core-0.1.0 origin ==="
          sed -n '/^\[origin\]/,$p' index/op/opencv_core/opencv_core-0.1.0.toml
          echo "=== Fedora OpenCV external mapping ==="
          cat index/op/opencv/opencv-external.toml
          echo "=== Alire version ==="
          command -v alr
          alr version
          ls -l "${GITHUB_WORKSPACE}/alire_install/bin/alr"

      - name: Diagnose Fedora container
        run: |
          set -eu
          docker run --rm \
            ghcr.io/alire-project/docker/gnat:fedora-latest \
            /bin/bash -c '
              set +e
              echo "=== Fedora environment (no package changes) ==="
              cat /etc/os-release
              uname -a
              uname -m
              echo "DISTTAG=${DISTTAG:-}"
              echo "FBR=${FBR:-}"
              echo "FGC=${FGC:-}"
              printenv | grep -E "^(DISTTAG|FBR|FGC)=" || true
              gcc --version
              g++ --version
              gnat --version
              gprbuild --version
              echo "=== opencv-devel before Alire resolution ==="
              rpm -q opencv-devel
              exit 0
            '

      - name: Test crate with upstream gh-build-crate.sh
        uses: mosteo-actions/docker-run@v2
        with:
          image: ghcr.io/alire-project/docker/gnat:fedora-latest
          host-dir: ${{ github.workspace }}/alire-index
          guest-dir: ${{ github.workspace }}/alire-index
          command: alire-index-checks/scripts/gh-build-crate.sh
          params: >-
            -v ${{ github.workspace }}/alire_install/bin/alr:/usr/bin/alr


