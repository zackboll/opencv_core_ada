name: OpenCV Compatibility

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: OpenCV 4.1
            container_dir: containers/debian12-opencv-4.1
            image: opencv-core-ci-4.1

          - name: OpenCV 4.6
            container_dir: containers/debian12-opencv-4.6
            image: opencv-core-ci-4.6

          - name: OpenCV 4.10
            container_dir: containers/debian13-opencv-4.10
            image: opencv-core-ci-4.10

          - name: OpenCV 5.0
            container_dir: containers/debian13-opencv-5.0
            image: opencv-core-ci-5.0

    name: ${{ matrix.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Alire dependencies
        uses: actions/cache@v4
        with:
          path: |
            .ci-cache/alire/releases
            .ci-cache/alire/builds
          key: alire-${{ matrix.image }}-${{ hashFiles('tests/alire.toml', 'tests/alire.lock') }}
          restore-keys: |
            alire-${{ matrix.image }}-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build compatibility image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.container_dir }}
          file: ${{ matrix.container_dir }}/Dockerfile
          load: true
          tags: ${{ matrix.image }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Verify OpenCV version
        run: |
          docker run --rm "${{ matrix.image }}" sh -c \
            'pkg-config --modversion opencv5 2>/dev/null || pkg-config --modversion opencv4 2>/dev/null || pkg-config --modversion opencv'

      - name: Run test suite
        run: |
          mkdir -p .ci-cache/alire/releases
          mkdir -p .ci-cache/alire/builds

          docker run --rm \
            -v "$PWD:/workspace" \
            -v "$PWD/.ci-cache/alire/releases:/root/.cache/alire/releases" \
            -v "$PWD/.ci-cache/alire/builds:/root/.cache/alire/builds" \
            -w /workspace \
            "${{ matrix.image }}" \
            alr -C tests run

  ubuntu-arm64:
    name: OpenCV Ubuntu 24.04 ARM64
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install OpenCV Core and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
          build-essential \
          ca-certificates \
          curl \
          git \
          libopencv-dev \
          pkg-config \
          unzip

      - name: Report architecture and OpenCV version
        run: |
          uname -m
          pkg-config --modversion opencv5 2>/dev/null || \
          pkg-config --modversion opencv4 2>/dev/null || \
          pkg-config --modversion opencv

      - name: Install Alire
        env:
          ALIRE_VERSION: "2.1.1"
        run: |
          curl -L \
            -o /tmp/alire.zip \
            "https://github.com/alire-project/alire/releases/download/v${ALIRE_VERSION}/alr-${ALIRE_VERSION}-bin-aarch64-linux.zip"
          unzip /tmp/alire.zip -d /tmp/alire
          sudo install -m 0755 /tmp/alire/bin/alr /usr/local/bin/alr
          rm -rf /tmp/alire /tmp/alire.zip
          alr --version

      - name: Select Ada toolchain
        run: |
          alr -n --force toolchain --select \
            gnat_native=16.1.0 \
            gprbuild=26.0.1
          alr toolchain

      - name: Run test suite
        run: alr -C tests run

      - name: Smoke test relocatable Ada library
        run: |
          set -eu
          OPENCV_CORE_LIBRARY_TYPE=relocatable alr -n build

          ada_library=$(find lib -maxdepth 1 -type f -name 'libopencv_core_ada*.so' -print -quit)
          if [ -z "${ada_library}" ]; then
            echo "error: relocatable libopencv_core_ada*.so is missing" >&2
            find lib -maxdepth 1 -type f -print || true
            exit 1
          fi

          echo "=== Relocatable Ada library ==="
          file_output=$(file "${ada_library}")
          echo "${file_output}"
          if ! printf '%s\n' "${file_output}" | grep -q 'shared object'; then
            echo "error: ${ada_library} is not an ELF shared library" >&2
            exit 1
          fi

          dependencies=$(readelf -d "${ada_library}" | grep '(NEEDED)' || true)
          echo "${dependencies}"
          if ! printf '%s\n' "${dependencies}" | grep -E 'libopencv_core\.so'; then
            echo "error: relocatable Ada library does not depend on OpenCV Core" >&2
            exit 1
          fi
          if ! printf '%s\n' "${dependencies}" | grep -F 'libstdc++.so'; then
            echo "error: relocatable Ada library does not depend on the C++ runtime" >&2
            exit 1
          fi
          if printf '%s\n' "${dependencies}" | grep -E 'libopencv_core_shim[^[:space:]]*\.so'; then
            echo "error: Static_PIC relocatable Ada library unexpectedly depends on a dynamic shim" >&2
            exit 1
          fi

          echo "=== Static_PIC shim symbol incorporated into Ada library ==="
          if ! nm -D --defined-only "${ada_library}" | grep -q 'opencv_core_mat_reshape'; then
            echo "error: relocatable Ada library does not define opencv_core_mat_reshape" >&2
            exit 1
          fi

  alire-ubuntu-lts:
    name: Alire Ubuntu LTS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Alire
        env:
          ALIRE_VERSION: "2.1.1"
        run: |
          curl -L \
            -o /tmp/alire.zip \
            "https://github.com/alire-project/alire/releases/download/v${ALIRE_VERSION}/alr-${ALIRE_VERSION}-bin-x86_64-linux.zip"
          unzip /tmp/alire.zip -d /tmp/alire
          mkdir -p "$PWD/alire_install/bin"
          install -m 0755 /tmp/alire/bin/alr "$PWD/alire_install/bin/alr"
          rm -rf /tmp/alire /tmp/alire.zip
          "$PWD/alire_install/bin/alr" version

      - name: Pull Alire Ubuntu LTS image
        run: docker pull ghcr.io/alire-project/docker/gnat:ubuntu-lts

      - name: Run test suite in Alire Ubuntu LTS image
        run: |
          docker run --rm \
            -e DEBIAN_FRONTEND=noninteractive \
            -v "$PWD:/workspace" \
            -v "$PWD/alire_install/bin/alr:/usr/bin/alr:ro" \
            -w /workspace \
            ghcr.io/alire-project/docker/gnat:ubuntu-lts \
            /bin/bash -c '
              set -eu

              echo "=== Environment ==="
              cat /etc/os-release
              uname -a
              uname -m

              gcc --version || true
              g++ --version || true
              gnat --version || true
              gprbuild --version || true
              pkg-config --version || echo "pkg-config is not installed yet"

              echo "=== Alire ==="
              command -v alr
              alr version

              echo "=== Install OpenCV development package ==="
              apt-get update
              apt-get install -y --no-install-recommends \
                libopencv-dev \
                pkg-config

              echo "=== OpenCV pkg-config ==="
              pkg-config --version
              if pkg-config --exists opencv5; then
                opencv_pkg=opencv5
              elif pkg-config --exists opencv4; then
                opencv_pkg=opencv4
              elif pkg-config --exists opencv; then
                opencv_pkg=opencv
              else
                echo "error: no OpenCV pkg-config package found" >&2
                exit 1
              fi
              echo "OpenCV pkg-config package: ${opencv_pkg}"
              pkg-config --modversion "${opencv_pkg}"
              pkg-config --cflags "${opencv_pkg}"
              pkg-config --libs "${opencv_pkg}"

              echo "=== Select Alire toolchain ==="
              alr -n --force toolchain --select \
                gnat_native=16.1.0 \
                gprbuild=26.0.1
              alr toolchain

              echo "=== Compiler visible inside Alire environment ==="
              alr exec -- which gnat
              alr exec -- gnat --version
              alr exec -- which gprbuild
              alr exec -- gprbuild --version

              echo "=== Build and test ==="
              alr -n build
              alr -n -C tests run
            '

  alire-fedora-latest:
    name: Alire Fedora Latest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Alire
        env:
          ALIRE_VERSION: "2.1.1"
        run: |
          curl -L \
            -o /tmp/alire.zip \
            "https://github.com/alire-project/alire/releases/download/v${ALIRE_VERSION}/alr-${ALIRE_VERSION}-bin-x86_64-linux.zip"
          unzip /tmp/alire.zip -d /tmp/alire
          mkdir -p "$PWD/alire_install/bin"
          install -m 0755 /tmp/alire/bin/alr "$PWD/alire_install/bin/alr"
          rm -rf /tmp/alire /tmp/alire.zip
          "$PWD/alire_install/bin/alr" version

      - name: Pull Alire Fedora Latest image
        run: docker pull ghcr.io/alire-project/docker/gnat:fedora-latest

      - name: Run test suite in Alire Fedora Latest image
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -v "$PWD/alire_install/bin/alr:/usr/bin/alr:ro" \
            -w /workspace \
            ghcr.io/alire-project/docker/gnat:fedora-latest \
            /bin/bash -c '
              set -eu

              git config --global --add safe.directory /workspace

              echo "=== Source being tested ==="
              git rev-parse HEAD
              git log -1 --oneline
              grep -n -A5 -B2 "Library_Type" opencv_core.gpr

              echo "=== Environment ==="
              cat /etc/os-release
              uname -a
              uname -m

              gcc --version || true
              g++ --version || true
              gnat --version || true
              gprbuild --version || true

              echo "=== Alire ==="
              command -v alr
              alr version

              echo "=== Install OpenCV development package ==="
              dnf install -y \
                opencv-devel \
                pkgconf-pkg-config \
                git

              echo "=== OpenCV pkg-config ==="
              pkg-config --version
              if pkg-config --exists opencv5; then
                opencv_pkg=opencv5
              elif pkg-config --exists opencv4; then
                opencv_pkg=opencv4
              elif pkg-config --exists opencv; then
                opencv_pkg=opencv
              else
                echo "error: no OpenCV pkg-config package found" >&2
                exit 1
              fi
              echo "OpenCV pkg-config package: ${opencv_pkg}"
              pkg-config --modversion "${opencv_pkg}"
              pkg-config --cflags "${opencv_pkg}"
              pkg-config --libs "${opencv_pkg}"

              echo "=== Select Alire toolchain ==="
              alr -n --force toolchain --select \
                gnat_native=16.1.0 \
                gprbuild=26.0.1
              alr toolchain

              echo "=== Compiler visible inside Alire environment ==="
              alr exec -- which gnat
              alr exec -- gnat --version
              alr exec -- which gprbuild
              alr exec -- gprbuild --version

              echo "=== Build ==="
              alr -n build

              echo "=== PIC diagnostic ==="
              shim_obj=$(find . -name opencv_core_shim.o | head -n 1 || true)
              if [ -n "${shim_obj}" ]; then
                echo "Found: ${shim_obj}"
                file "${shim_obj}"
                readelf -h "${shim_obj}" | grep -E "Class:|Data:|Type:|Machine:" || true
                readelf -rW "${shim_obj}" | grep -E "R_X86_64_32|R_X86_64_32S|R_X86_64_PC32" || true
              else
                echo "opencv_core_shim.o not found"
              fi

              echo "=== Test ==="
              alr -n -C tests run
            '

  macos-arm64:
    name: OpenCV macOS ARM64
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Report source and runner
        run: |
          set -eu
          echo "=== Source being tested ==="
          git rev-parse HEAD
          git log -1 --oneline
          echo "=== Runner ==="
          uname -a
          uname -m
          sw_vers

      - name: Set up Alire
        uses: alire-project/setup-alire@latest
        with:
          version: "2.1.1"
          toolchain: "gnat_native gprbuild"

      - name: Select and prove Ada toolchain
        run: |
          set -eu
          alr -n --force toolchain --select \
            gnat_native=16.1.0 \
            gprbuild=26.0.1

          echo "=== Alire ==="
          alr version
          alr toolchain

          echo "=== Compiler visible inside Alire environment ==="
          alr exec -- which gnat
          alr exec -- gnat --version
          alr exec -- which gprbuild
          alr exec -- gprbuild --version

          echo "=== C++ compiler inside Alire environment ==="
          alr exec -- which g++ || true
          alr exec -- g++ --version || true

          echo "=== Apple clang++ ==="
          xcrun --find clang++ || true
          xcrun clang++ --version || true

      - name: Install Homebrew OpenCV
        run: |
          set -eu
          brew install opencv

          echo "=== Homebrew prefixes ==="
          brew --prefix
          brew --prefix opencv

          echo "=== Homebrew OpenCV info ==="
          brew info opencv

      - name: Report Homebrew OpenCV and pkg-config
        run: |
          set -eu
          opencv_prefix="$(brew --prefix opencv)"
          brew_pkgconfig="$(brew --prefix)/lib/pkgconfig"
          opencv_pkgconfig="${opencv_prefix}/lib/pkgconfig"

          if [ -d "${brew_pkgconfig}" ]; then
            export PKG_CONFIG_PATH="${brew_pkgconfig}${PKG_CONFIG_PATH:+:${PKG_CONFIG_PATH}}"
          fi
          if [ -d "${opencv_pkgconfig}" ]; then
            export PKG_CONFIG_PATH="${opencv_pkgconfig}${PKG_CONFIG_PATH:+:${PKG_CONFIG_PATH}}"
          fi

          echo "PKG_CONFIG_PATH=${PKG_CONFIG_PATH:-}"
          echo "PKG_CONFIG_PATH=${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"

          echo "=== pkg-config ==="
          pkg-config --version

          if pkg-config --exists opencv5; then
            opencv_pkg=opencv5
          elif pkg-config --exists opencv4; then
            opencv_pkg=opencv4
          elif pkg-config --exists opencv; then
            opencv_pkg=opencv
          else
            echo "error: no OpenCV pkg-config package found" >&2
            echo "tried opencv5, opencv4, opencv" >&2
            pkg-config --list-all | grep -i opencv || true
            exit 1
          fi

          echo "selected OpenCV pkg-config package: ${opencv_pkg}"
          echo "OPENCV_PKG=${opencv_pkg}" >> "$GITHUB_ENV"
          pkg-config --modversion "${opencv_pkg}"
          pkg-config --cflags "${opencv_pkg}"
          pkg-config --libs "${opencv_pkg}"

          echo "=== Homebrew OpenCV libraries ==="
          ls -l "${opencv_prefix}/lib"

      - name: Build current source
        id: root-build
        run: |
          set -eu
          alr -n build

      - name: Run test suite
        id: tests
        if: ${{ always() && steps.root-build.outcome == 'success' }}
        run: alr -n -C tests run

      - name: Verify shim library architecture
        if: ${{ always() && steps.root-build.outcome == 'success' }}
        run: |
          set -eu
          echo "=== Ada archive must not contain the C++ shim ==="
          if [ ! -f lib/libopencv_core_ada.a ]; then
            echo "error: lib/libopencv_core_ada.a is missing" >&2
            exit 1
          fi
          shim_count=$(ar -t lib/libopencv_core_ada.a | grep -c '^opencv_core_shim\.o$' || true)
          echo "opencv_core_shim.o count in libopencv_core_ada.a=${shim_count}"
          if [ "${shim_count}" -ne 0 ]; then
            echo "error: libopencv_core_ada.a still contains opencv_core_shim.o" >&2
            ar -t lib/libopencv_core_ada.a
            exit 1
          fi

          echo "=== Production shim dylib ==="
          shim_dylib=""
          for candidate in lib/libopencv_core_shim.dylib lib/libopencv_core_shim.*.dylib; do
            if [ -e "${candidate}" ]; then
              shim_dylib="${candidate}"
              break
            fi
          done
          if [ -z "${shim_dylib}" ]; then
            echo "error: production libopencv_core_shim*.dylib is missing" >&2
            ls -l lib
            exit 1
          fi
          echo "Found: ${shim_dylib}"
          otool -L "${shim_dylib}"

          echo "=== Shim dylib must use OpenCV and libc++, not libstdc++ ==="
          otool -L "${shim_dylib}" | grep -E 'libopencv_core'
          otool -L "${shim_dylib}" | grep -E 'libc\+\+'
          if otool -L "${shim_dylib}" | grep -E 'libstdc\+\+'; then
            echo "error: shim dylib depends on libstdc++" >&2
            exit 1
          fi

          echo "=== Shim dylib exports opencv_core_mat_reshape ==="
          nm -gU "${shim_dylib}" | grep opencv_core_mat_reshape

          echo "=== Test executable depends on production shim dylib ==="
          test_exe="tests/bin/tests"
          if [ ! -e "${test_exe}" ]; then
            echo "error: ${test_exe} is missing" >&2
            ls -l tests/bin
            exit 1
          fi
          otool -L "${test_exe}"
          otool -L "${test_exe}" | grep libopencv_core_shim
          if otool -L "${test_exe}" | grep -E 'libopencv_core_shim_diag|libopencv_core_shim_ada_diag'; then
            echo "error: test executable depends on a diagnostic shim dylib" >&2
            exit 1
          fi

      - name: Smoke test relocatable Ada library
        run: |
          set -eu
          OPENCV_CORE_LIBRARY_TYPE=relocatable alr -n build

          ada_library=""
          for candidate in lib/libopencv_core_ada.dylib lib/libopencv_core_ada.*.dylib; do
            if [ -e "${candidate}" ]; then
              ada_library="${candidate}"
              break
            fi
          done
          if [ -z "${ada_library}" ]; then
            echo "error: relocatable libopencv_core_ada*.dylib is missing" >&2
            ls -l lib || true
            exit 1
          fi

          echo "=== Relocatable Ada library ==="
          dependencies=$(otool -L "${ada_library}")
          echo "${dependencies}"
          if ! printf '%s\n' "${dependencies}" | grep -F 'libopencv_core_shim'; then
            echo "error: relocatable Ada library does not depend on the production shim" >&2
            exit 1
          fi
          if printf '%s\n' "${dependencies}" | grep -E 'libopencv_core\.[0-9][^[:space:]]*\.dylib'; then
            echo "error: relocatable Ada library unexpectedly depends directly on OpenCV Core" >&2
            exit 1
          fi
          if printf '%s\n' "${dependencies}" | grep -F '/usr/lib/libc++.1.dylib'; then
            echo "error: relocatable Ada library unexpectedly depends directly on libc++" >&2
            exit 1
          fi

          echo "=== Ada/GNAT runtime dependencies (allowed) ==="
          printf '%s\n' "${dependencies}" | grep -E 'libstdc\+\+\.6\.dylib|libgcc_s\.1\.1\.dylib|libgnat-16\.dylib|libgnarl-16\.dylib' || echo "none"

  macos-arm64-macports:
    name: OpenCV macOS ARM64 (MacPorts)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Report source and runner
        run: |
          set -eu
          echo "=== Source being tested ==="
          git rev-parse HEAD
          git log -1 --oneline
          echo "=== Runner ==="
          uname -a
          uname -m
          sw_vers

      - name: Set up Alire
        uses: alire-project/setup-alire@latest
        with:
          version: "2.1.1"
          toolchain: "gnat_native gprbuild"

      - name: Select and prove Ada toolchain
        run: |
          set -eu
          alr -n --force toolchain --select \
            gnat_native=16.1.0 \
            gprbuild=26.0.1

          echo "=== Alire ==="
          alr version
          alr toolchain

          echo "=== Compiler visible inside Alire environment ==="
          alr exec -- which gnat
          alr exec -- gnat --version
          alr exec -- which gprbuild
          alr exec -- gprbuild --version

          echo "=== C++ compiler inside Alire environment ==="
          alr exec -- which g++ || true
          alr exec -- g++ --version || true

          echo "=== Apple clang++ ==="
          xcrun --find clang++ || true
          xcrun clang++ --version || true

      - name: Disable Homebrew
        run: rm -f $(which brew)
        shell: bash

      - name: Set up MacPorts
        uses: melusina-org/setup-macports@v1

      - name: Configure MacPorts for Quartz
        run: |
          set -eu
          echo '-x11 +no_x11 +quartz' >> /opt/local/etc/macports/variants.conf
          cat /opt/local/etc/macports/variants.conf

      - name: Verify Alire detects MacPorts
        run: |
          set -eu
          echo "=== Alire platform ==="
          alr version
          if ! alr version | grep -q 'distribution:[[:space:]]*MACPORTS'; then
            echo "error: Alire did not report distribution: MACPORTS" >&2
            exit 1
          fi

      - name: Install MacPorts OpenCV
        run: |
          set -eu
          sudo port -N install opencv4

      - name: Report MacPorts OpenCV and pkg-config
        run: |
          set -eu
          echo "=== MacPorts ==="
          port version
          port installed opencv4

          echo "=== pkg-config ==="
          command -v pkg-config
          pkg-config --version

          echo "=== MacPorts opencv4 pkg-config files ==="
          port contents opencv4 | grep -E 'pkgconfig|\.pc$' || true

          echo "PKG_CONFIG_PATH is not exported by this job"
          echo "PKG_CONFIG_PATH=${PKG_CONFIG_PATH:-<unset>}"

      - name: Build current source
        id: root-build
        run: |
          set -eu
          unset PKG_CONFIG_PATH
          echo "PKG_CONFIG_PATH=${PKG_CONFIG_PATH:-<unset>}"
          alr -n build

      - name: Verify generated OpenCV configuration
        if: ${{ always() && steps.root-build.outcome == 'success' }}
        run: |
          set -eu
          echo "=== Generated config/opencv_core_install.gpr ==="
          cat config/opencv_core_install.gpr

          if ! grep -F '/opt/local/include/opencv4' config/opencv_core_install.gpr; then
            echo "error: generated GPR did not select MacPorts include path" >&2
            exit 1
          fi
          if ! grep -F '/opt/local/lib/opencv4' config/opencv_core_install.gpr; then
            echo "error: generated GPR did not select MacPorts library path" >&2
            exit 1
          fi
          if ! grep -F 'Shim_Build : Shim_Build_Kind := "Relocatable";' config/opencv_core_install.gpr; then
            echo "error: generated GPR did not select a relocatable shim" >&2
            exit 1
          fi
          if ! grep -F 'Cxx_Toolchain : Cxx_Toolchain_Kind := "Apple_Clang";' config/opencv_core_install.gpr; then
            echo "error: generated GPR did not select Apple clang++" >&2
            exit 1
          fi
          if ! grep -F 'Ada_Link : Ada_Link_Kind := "Default";' config/opencv_core_install.gpr; then
            echo "error: generated GPR did not select default Ada linking" >&2
            exit 1
          fi
          if ! grep -E 'Cxx_Sysroot := "[^"]+";' config/opencv_core_install.gpr; then
            echo "error: generated GPR did not record the macOS SDK sysroot" >&2
            exit 1
          fi

      - name: Run test suite
        id: tests
        if: ${{ always() && steps.root-build.outcome == 'success' }}
        run: |
          set -eu
          unset PKG_CONFIG_PATH
          echo "PKG_CONFIG_PATH=${PKG_CONFIG_PATH:-<unset>}"
          alr -n -C tests run

      - name: Verify shim library architecture
        if: ${{ always() && steps.root-build.outcome == 'success' }}
        run: |
          set -eu
          echo "=== Ada archive must not contain the C++ shim ==="
          if [ ! -f lib/libopencv_core_ada.a ]; then
            echo "error: lib/libopencv_core_ada.a is missing" >&2
            exit 1
          fi
          shim_count=$(ar -t lib/libopencv_core_ada.a | grep -c '^opencv_core_shim\.o$' || true)
          echo "opencv_core_shim.o count in libopencv_core_ada.a=${shim_count}"
          if [ "${shim_count}" -ne 0 ]; then
            echo "error: libopencv_core_ada.a still contains opencv_core_shim.o" >&2
            ar -t lib/libopencv_core_ada.a
            exit 1
          fi

          echo "=== Production shim dylib ==="
          shim_dylib=""
          for candidate in lib/libopencv_core_shim.dylib lib/libopencv_core_shim.*.dylib; do
            if [ -e "${candidate}" ]; then
              shim_dylib="${candidate}"
              break
            fi
          done
          if [ -z "${shim_dylib}" ]; then
            echo "error: production libopencv_core_shim*.dylib is missing" >&2
            ls -l lib
            exit 1
          fi
          echo "Found: ${shim_dylib}"
          otool -L "${shim_dylib}"

          echo "=== Shim dylib must use MacPorts OpenCV and libc++, not Homebrew or libstdc++ ==="
          otool -L "${shim_dylib}" | grep -E '/opt/local/lib/opencv4/libopencv_core'
          otool -L "${shim_dylib}" | grep -F '/usr/lib/libc++.1.dylib'
          if otool -L "${shim_dylib}" | grep -E '/opt/homebrew'; then
            echo "error: shim dylib depends on Homebrew" >&2
            exit 1
          fi
          if otool -L "${shim_dylib}" | grep -E 'libstdc\+\+'; then
            echo "error: shim dylib depends on libstdc++" >&2
            exit 1
          fi

          echo "=== Test executable depends on production shim dylib ==="
          test_exe="tests/bin/tests"
          if [ ! -e "${test_exe}" ]; then
            echo "error: ${test_exe} is missing" >&2
            ls -l tests/bin
            exit 1
          fi
          otool -L "${test_exe}"
          otool -L "${test_exe}" | grep libopencv_core_shim
          if otool -L "${test_exe}" | grep -E 'libopencv_core_shim_diag|libopencv_core_shim_ada_diag'; then
            echo "error: test executable depends on a diagnostic shim dylib" >&2
            exit 1
          fi


  windows-x86_64-msys2:
    name: OpenCV Windows x86_64 (MSYS2)
    runs-on: windows-latest
    env:
      OPENCV_CORE_CI: "1"
      TESTS_STATIC_ADA_RUNTIME: "True"

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Report source and runner
        run: |
          set -eu
          echo "=== Source being tested ==="
          git rev-parse HEAD
          git log -1 --oneline
          echo "=== Runner ==="
          uname -a
          uname -s
          uname -m

      - name: Set up Alire
        uses: alire-project/setup-alire@latest
        with:
          version: "2.1.1"
          toolchain: "gnat_native gprbuild"
          msys2: true

      - name: Select and prove Ada toolchain
        run: |
          set -eu
          alr -n --force toolchain --select \
            gnat_native=16.1.0 \
            gprbuild=26.0.1

          echo "=== Alire ==="
          alr version
          alr toolchain

          echo "=== Platform detection ==="
          uname -a
          uname -s
          uname -m

          if ! alr version | grep -qi 'distribution:[[:space:]]*MSYS2'; then
            echo "error: Alire did not report distribution: MSYS2" >&2
            alr version
            exit 1
          fi
          if ! alr version | grep -qi 'host-arch:[[:space:]]*X86_64'; then
            echo "error: Alire did not report host-arch: X86_64" >&2
            alr version
            exit 1
          fi
          if ! alr version | grep -qi 'os:[[:space:]]*WINDOWS'; then
            echo "error: Alire did not report os: WINDOWS" >&2
            alr version
            exit 1
          fi

          echo "=== Compiler visible inside Alire environment ==="
          alr exec -- which gnat
          alr exec -- gnat --version
          alr exec -- which gprbuild
          alr exec -- gprbuild --version
          alr exec -- which g++ || true
          alr exec -- g++ --version || true

      - name: Verify Alire-managed MSYS2 pacman
        run: |
          set -eu
          echo "=== pacman ==="
          pacman_path=$(alr exec -- which pacman)
          echo "pacman=${pacman_path}"
          pacman_win=$(alr exec -- sh -c 'cygpath -w "$(which pacman)"' || true)
          echo "pacman Windows path=${pacman_win:-<unavailable>}"
          pacman_path_norm=$(printf '%s' "${pacman_win:-${pacman_path}}" | tr '\\' '/' | tr '[:upper:]' '[:lower:]')
          case "${pacman_path_norm}" in
            *alire*/*msys64*|*msys64*pacman*|/usr/bin/pacman*)
              echo "pacman resolves to the Alire-managed MSYS2 installation"
              ;;
            *)
              echo "error: pacman is not the Alire-managed MSYS2 pacman: ${pacman_path}" >&2
              alr exec -- which pacman || true
              alr settings --global || true
              exit 1
              ;;
          esac
          alr exec -- pacman --version

      - name: Install OpenCV through Alire MSYS2
        run: |
          set -eu
          alr exec -- pacman -Sy --noconfirm --needed \
            mingw-w64-x86_64-opencv \
            mingw-w64-x86_64-pkg-config \
            mingw-w64-x86_64-gcc

          echo "=== Installed MSYS2 packages ==="
          alr exec -- pacman -Q mingw-w64-x86_64-opencv mingw-w64-x86_64-pkg-config mingw-w64-x86_64-gcc

      - name: Demonstrate pkg-config collision
        run: |
          set -eu
          echo "=== Generic pkg-config (may be Strawberry Perl) ==="
          command -v pkg-config || true
          where.exe pkg-config || true

          echo "=== Target-prefixed MinGW pkg-config ==="
          prefixed=$(alr exec -- which x86_64-w64-mingw32-pkg-config)
          echo "x86_64-w64-mingw32-pkg-config=${prefixed}"
          where.exe x86_64-w64-mingw32-pkg-config || true

          prefixed_win=$(alr exec -- sh -c 'cygpath -w "$(which x86_64-w64-mingw32-pkg-config)"' || true)
          echo "prefixed Windows path=${prefixed_win:-<unavailable>}"
          prefixed_norm=$(printf '%s' "${prefixed_win:-${prefixed}}" | tr '\\' '/' | tr '[:upper:]' '[:lower:]')
          case "${prefixed_norm}" in
            *msys64*mingw64*|*mingw64/bin/x86_64-w64-mingw32-pkg-config*)
              echo "target-prefixed pkg-config resolves to the MinGW64 tree"
              ;;
            *)
              echo "error: x86_64-w64-mingw32-pkg-config is not the Alire MSYS2 MinGW64 executable: ${prefixed}" >&2
              exit 1
              ;;
          esac

      - name: Verify OpenCV pkg-config metadata
        run: |
          set -eu
          echo "=== OpenCV pkg-config metadata installed by MSYS2 ==="
          alr exec -- pacman -Ql mingw-w64-x86_64-opencv | grep '/lib/pkgconfig/opencv5\.pc$'

          echo "=== x86_64-w64-mingw32-pkg-config opencv5 ==="
          alr exec -- x86_64-w64-mingw32-pkg-config --exists opencv5
          alr exec -- x86_64-w64-mingw32-pkg-config --modversion opencv5
          alr exec -- x86_64-w64-mingw32-pkg-config --cflags opencv5
          alr exec -- x86_64-w64-mingw32-pkg-config --libs opencv5

          echo "PKG_CONFIG=${PKG_CONFIG:-<unset>}"
          echo "PKG_CONFIG_PATH=${PKG_CONFIG_PATH:-<unset>}"

      - name: Build current source
        id: root-build
        run: |
          set -eu
          echo "PKG_CONFIG=${PKG_CONFIG:-<unset>}"
          echo "PKG_CONFIG_PATH=${PKG_CONFIG_PATH:-<unset>}"
          log="${RUNNER_TEMP:-$PWD}/opencv-core-windows-root-build.log"
          if ! alr -n build -- -v >"${log}" 2>&1; then
            echo "=== Root build failed ==="
            cat "${log}"
            exit 1
          fi
          cat "${log}"
          if ! grep -F 'Building External_Relocatable OpenCV Core shim' "${log}"; then
            echo "error: root build did not run the repository external shim builder" >&2
            exit 1
          fi
          if [ ! -f obj/shim/external/opencv_core_shim.o ]; then
            echo "error: external shim object was not produced" >&2
            exit 1
          fi
          unexpected_objects=$(find obj/shim -type f -name 'opencv_core_shim.o' ! -path 'obj/shim/external/opencv_core_shim.o' -print)
          if [ -n "${unexpected_objects}" ]; then
            echo "error: GPRbuild independently produced another shim object" >&2
            printf '%s\n' "${unexpected_objects}"
            exit 1
          fi
          echo "Root build completed successfully."

      - name: Verify generated OpenCV configuration
        if: ${{ always() && steps.root-build.outcome == 'success' }}
        run: |
          set -eu
          echo "=== Generated config/opencv_core_install.gpr ==="
          cat config/opencv_core_install.gpr

          if ! grep -F 'Shim_Build : Shim_Build_Kind := "External_Relocatable";' config/opencv_core_install.gpr; then
            echo "error: generated GPR did not select an external relocatable shim" >&2
            exit 1
          fi
          if ! grep -F 'Cxx_Toolchain : Cxx_Toolchain_Kind := "GNU";' config/opencv_core_install.gpr; then
            echo "error: generated GPR did not select the GNU C++ toolchain" >&2
            exit 1
          fi
          if ! grep -F 'Ada_Link : Ada_Link_Kind := "Shared_Shim_Static_GCC_Runtime";' config/opencv_core_install.gpr; then
            echo "error: generated GPR did not select shared-shim static GCC runtime linking" >&2
            exit 1
          fi
          if ! grep -F 'Cxx_Sysroot := "";' config/opencv_core_install.gpr; then
            echo "error: generated GPR unexpectedly selected a C++ sysroot" >&2
            exit 1
          fi
          cxx_driver=$(sed -n 's/.*Cxx_Driver := "\(.*\)";/\1/p' config/opencv_core_install.gpr)
          echo "Cxx_Driver=${cxx_driver}"
          case "${cxx_driver}" in
            *gnat_native*)
              echo "error: generated GPR selected GNAT g++: ${cxx_driver}" >&2
              exit 1
              ;;
            *mingw64*g++*)
              echo "generated GPR selected MSYS2 MinGW64 g++"
              ;;
            *)
              echo "error: generated GPR did not select MSYS2 MinGW64 g++: ${cxx_driver}" >&2
              exit 1
              ;;
          esac
          if [ ! -f "${cxx_driver}" ]; then
            echo "error: generated C++ driver does not exist: ${cxx_driver}" >&2
            exit 1
          fi
          echo "=== MSYS2 C++ compiler ==="
          ls -l "${cxx_driver}"
          "${cxx_driver}" --version
          if ! grep -F 'Cxx_Runtime_Switch := "-lstdc++";' config/opencv_core_install.gpr; then
            echo "error: generated GPR did not select -lstdc++" >&2
            exit 1
          fi
          if ! grep -E 'OpenCV_Core_Link_Option := "[^"]*mingw64[/\\]lib[/\\]libopencv_core\.dll\.a";' config/opencv_core_install.gpr; then
            echo "error: generated GPR did not select the MinGW64 OpenCV Core import library" >&2
            exit 1
          fi
          if ! grep -E 'mingw64' config/opencv_core_install.gpr; then
            echo "error: generated GPR did not point at the MinGW64 OpenCV installation" >&2
            exit 1
          fi
          if ! grep -E 'include[/\\]opencv5' config/opencv_core_install.gpr; then
            echo "error: generated GPR did not select mingw64/include/opencv5" >&2
            exit 1
          fi
          if ! grep -E 'Library_Search_Switch := "-L[^"]*mingw64[^"]*lib' config/opencv_core_install.gpr; then
            echo "error: generated GPR did not select mingw64/lib" >&2
            exit 1
          fi

          import_library=$(sed -n 's/.*OpenCV_Core_Link_Option := "\(.*\)";/\1/p' config/opencv_core_install.gpr)
          echo "OpenCV_Core_Link_Option=${import_library}"
          if [ ! -f "${import_library}" ]; then
            echo "error: generated OpenCV Core import library does not exist: ${import_library}" >&2
            alr exec -- pacman -Ql mingw-w64-x86_64-opencv | grep 'libopencv_core\.dll\.a$' || true
            exit 1
          fi
          echo "=== OpenCV Core import library ==="
          ls -l "${import_library}"
          alr exec -- pacman -Ql mingw-w64-x86_64-opencv | grep 'libopencv_core\.dll\.a$'

      - name: Verify shim library architecture
        if: ${{ always() && steps.root-build.outcome == 'success' }}
        run: |
          set -eu
          echo "=== Production shim artifacts ==="
          ls -l lib || true

          shim_dll=""
          for candidate in lib/libopencv_core_shim.dll lib/opencv_core_shim.dll; do
            if [ -f "${candidate}" ]; then
              shim_dll="${candidate}"
              break
            fi
          done
          if [ -z "${shim_dll}" ]; then
            echo "error: production opencv_core_shim DLL is missing" >&2
            ls -l lib || true
            exit 1
          fi
          echo "Found shim DLL: ${shim_dll}"
          ls -l "${shim_dll}"

          if [ -f lib/libopencv_core_shim.a ]; then
            echo "error: Windows production shim is still a static archive" >&2
            exit 1
          fi

          echo "=== Ada archive must not contain the C++ shim ==="
          if [ ! -f lib/libopencv_core_ada.a ]; then
            echo "error: lib/libopencv_core_ada.a is missing" >&2
            ls -l lib || true
            exit 1
          fi
          shim_count=$(alr exec -- ar -t lib/libopencv_core_ada.a | grep -c '^opencv_core_shim\.o$' || true)
          echo "opencv_core_shim.o count in libopencv_core_ada.a=${shim_count}"
          if [ "${shim_count}" -ne 0 ]; then
            echo "error: libopencv_core_ada.a still contains opencv_core_shim.o" >&2
            alr exec -- ar -t lib/libopencv_core_ada.a
            exit 1
          fi

          dump=""
          if alr exec -- which objdump >/dev/null 2>&1; then
            dump=objdump
          elif alr exec -- which x86_64-w64-mingw32-objdump >/dev/null 2>&1; then
            dump=x86_64-w64-mingw32-objdump
          fi
          if [ -z "${dump}" ]; then
            echo "error: objdump is required to inspect Windows PE dependencies" >&2
            exit 1
          fi
          echo "=== Shim DLL dependencies (${dump} -p) ==="
          alr exec -- "${dump}" -p "${shim_dll}" | grep -i 'DLL Name' || true
          if ! alr exec -- "${dump}" -p "${shim_dll}" | grep -qi 'libopencv_core-500.dll'; then
            echo "error: shim DLL does not reference libopencv_core-500.dll" >&2
            exit 1
          fi
          if ! alr exec -- "${dump}" -p "${shim_dll}" | grep -qi 'libgcc_s_seh-1.dll'; then
            echo "error: shim DLL does not import libgcc_s_seh-1.dll" >&2
            exit 1
          fi
          if ! alr exec -- "${dump}" -p "${shim_dll}" | grep -qi 'libstdc++-6.dll'; then
            echo "error: shim DLL does not import libstdc++-6.dll" >&2
            exit 1
          fi


      - name: Run test suite
        id: tests
        if: ${{ always() && steps.root-build.outcome == 'success' }}
        run: |
          set -eu
          echo "PKG_CONFIG=${PKG_CONFIG:-<unset>}"
          echo "PKG_CONFIG_PATH=${PKG_CONFIG_PATH:-<unset>}"
          echo "=== Alire execution PATH (informational; tests.exe is not launched by alr run) ==="
          alr_path=$(alr exec -- sh -c 'printf "%s" "$PATH"')
          printf '%s\n' "${alr_path}"

          dump=""
          if alr exec -- which objdump >/dev/null 2>&1; then
            dump=objdump
          elif alr exec -- which x86_64-w64-mingw32-objdump >/dev/null 2>&1; then
            dump=x86_64-w64-mingw32-objdump
          fi
          if [ -z "${dump}" ]; then
            echo "error: objdump is required to inspect Windows PE dependencies" >&2
            exit 1
          fi

          cxx_driver=$(sed -n 's/.*Cxx_Driver := "\(.*\)";/\1/p' config/opencv_core_install.gpr)
          runtime_dir=$(dirname "${cxx_driver}")
          lib_dir="${PWD}/lib"
          echo "=== MSYS2 runtime directory ==="
          printf '%s\n' "${runtime_dir}"
          case "${runtime_dir}" in
            *mingw64*bin*)
              ;;
            *)
              echo "error: runtime directory is not MSYS2 mingw64/bin: ${runtime_dir}" >&2
              exit 1
              ;;
          esac
          if [ ! -d "${runtime_dir}" ]; then
            echo "error: MSYS2 runtime directory does not exist: ${runtime_dir}" >&2
            exit 1
          fi

          echo "=== MSYS2 runtime DLLs ==="
          for name in libgcc_s_seh-1.dll libstdc++-6.dll libopencv_core-500.dll; do
            candidate="${runtime_dir}/${name}"
            if [ -f "${candidate}" ]; then
              ls -l "${candidate}"
              sha256sum "${candidate}" || true
            else
              echo "error: missing MSYS2 runtime DLL: ${candidate}" >&2
              exit 1
            fi
          done

          shim_dll=""
          for candidate in lib/libopencv_core_shim.dll lib/opencv_core_shim.dll "${lib_dir}/libopencv_core_shim.dll"; do
            if [ -f "${candidate}" ]; then
              shim_dll="${candidate}"
              break
            fi
          done
          if [ -z "${shim_dll}" ]; then
            echo "error: libopencv_core_shim.dll is missing before windows_shim_smoke.exe" >&2
            ls -l lib || true
            exit 1
          fi

          echo "=== GNAT gcc for windows_shim_smoke.exe ==="
          gnat_gcc=$(alr exec -- which gcc || true)
          gnat_bin=""
          if [ -n "${gnat_gcc}" ]; then
            gnat_bin=$(dirname "${gnat_gcc}")
            echo "GNAT gcc=${gnat_gcc}"
            echo "GNAT bin=${gnat_bin}"
          fi
          if [ -z "${gnat_gcc}" ]; then
            echo "error: GNAT gcc is required to compile windows_shim_smoke.exe" >&2
            exit 1
          fi
          case "${gnat_gcc}" in
            *mingw64*)
              echo "error: smoke compiler resolved to MSYS2 gcc: ${gnat_gcc}" >&2
              exit 1
              ;;
          esac
          if [ ! -f "${gnat_gcc}" ]; then
            echo "error: GNAT gcc does not exist: ${gnat_gcc}" >&2
            exit 1
          fi
          if [ ! -f lib/libopencv_core_shim.dll.a ]; then
            echo "error: production shim import library is missing: lib/libopencv_core_shim.dll.a" >&2
            ls -l lib || true
            exit 1
          fi

          path_lib="${lib_dir}"
          path_runtime="${runtime_dir}"
          path_lib_posix="${lib_dir}"
          path_runtime_posix="${runtime_dir}"
          shim_dll_win="${shim_dll}"
          if command -v cygpath >/dev/null 2>&1; then
            path_lib=$(cygpath -wa "${lib_dir}")
            path_runtime=$(cygpath -wa "${runtime_dir}")
            path_lib_posix=$(cygpath -u "${lib_dir}")
            path_runtime_posix=$(cygpath -u "${runtime_dir}")
            shim_dll_win=$(cygpath -wa "${shim_dll}")
          fi
          windows_test_path="${path_lib_posix}:${path_runtime_posix}:${PATH}"
          echo "=== Absolute libopencv_core_shim.dll path ==="
          printf '%s\n' "${shim_dll_win}"
          echo "=== Effective runtime PATH prefixes ==="
          printf '%s\n' "${path_lib}"
          printf '%s\n' "${path_runtime}"

          mkdir -p tests/bin
          smoke_exe="tests/bin/windows_shim_smoke.exe"
          echo "=== GNAT gcc smoke compile command ==="
          echo "alr exec -- gcc -o ${smoke_exe} tests/windows_shim_smoke.c -Icpp -Llib -lopencv_core_shim -static-libgcc"
          alr exec -- gcc -o "${smoke_exe}" tests/windows_shim_smoke.c \
            -Icpp -Llib -lopencv_core_shim -static-libgcc
          if [ ! -f "${smoke_exe}" ]; then
            echo "error: windows_shim_smoke.exe was not produced" >&2
            ls -l tests/bin || true
            exit 1
          fi

          echo "=== windows_shim_smoke.exe PE imports (${dump} -p) ==="
          smoke_deps=$(alr exec -- "${dump}" -p "${smoke_exe}" | grep -i 'DLL Name' || true)
          echo "${smoke_deps}"
          if ! printf '%s\n' "${smoke_deps}" | grep -qi 'libopencv_core_shim.dll'; then
            echo "error: windows_shim_smoke.exe does not import libopencv_core_shim.dll" >&2
            exit 1
          fi
          if printf '%s\n' "${smoke_deps}" | grep -qi 'libopencv_core-500.dll'; then
            echo "error: windows_shim_smoke.exe still imports OpenCV Core directly" >&2
            exit 1
          fi
          if printf '%s\n' "${smoke_deps}" | grep -qi 'libstdc++-6.dll'; then
            echo "error: windows_shim_smoke.exe still imports libstdc++-6.dll" >&2
            exit 1
          fi
          if printf '%s\n' "${smoke_deps}" | grep -qi 'libgcc_s_seh-1.dll'; then
            echo "error: windows_shim_smoke.exe still imports libgcc_s_seh-1.dll" >&2
            exit 1
          fi

          smoke_exe_win="${smoke_exe}"
          if command -v cygpath >/dev/null 2>&1; then
            smoke_exe_win=$(cygpath -wa "${smoke_exe}")
          fi
          echo "=== Absolute windows_shim_smoke.exe path ==="
          printf '%s\n' "${smoke_exe_win}"

          set +e
          echo "=== Effective runtime PATH ==="
          printf '%s\n' "${windows_test_path}"

          echo "=== Direct windows_shim_smoke.exe execution ==="
          PATH="${windows_test_path}" "${smoke_exe}"
          smokeExitCode=$?
          echo "WINDOWS_SHIM_SMOKE_EXIT_CODE=${smokeExitCode}"

          if [ "${smokeExitCode}" -ne 0 ]; then
            echo "=== windows_shim_smoke.exe failed; PE/dependency diagnostics ==="
            if [ -n "${dump}" ]; then
              alr exec -- "${dump}" -p "${smoke_exe}" | grep -i 'DLL Name' || echo "warning: could not dump smoke PE imports"
              alr exec -- "${dump}" -p "${shim_dll}" | grep -i 'DLL Name' || echo "warning: could not dump shim PE imports"
            fi
            echo "WINDOWS_SHIM_SMOKE_EXIT_CODE=${smokeExitCode}"
            exit "${smokeExitCode}"
          fi
          echo "WINDOWS_SHIM_SMOKE_RAN"
          set -e

          log="${RUNNER_TEMP:-$PWD}/opencv-core-windows-test-build.log"
          echo "TESTS_STATIC_ADA_RUNTIME=${TESTS_STATIC_ADA_RUNTIME:-<unset>}"
          if ! alr -n -C tests build -- -v -XTESTS_STATIC_ADA_RUNTIME=True >"${log}" 2>&1; then
            echo "=== Test build failed ==="
            cat "${log}"
            exit 1
          fi
          # Extract the actual tests.exe link command. Do not treat the
          # separate libopencv_core_shim.dll link (-shared-libgcc -o ...) as
          # the final test executable link.
          link_cmd=$(grep -E -- '-o[[:space:]]*[^[:space:]]*tests\.exe([[:space:]]|$)' "${log}" | tail -n 1 || true)
          if [ -z "${link_cmd}" ]; then
            echo "error: could not extract the tests.exe link command" >&2
            exit 1
          fi
          if printf '%s\n' "${link_cmd}" | grep -E -- '-L[^[:space:]]*msys64[/\\]mingw64[/\\]lib([[:space:]]|$)'; then
            echo "error: tests.exe link still searches MSYS2 mingw64/lib" >&2
            exit 1
          fi
          if printf '%s\n' "${link_cmd}" | grep -F 'libopencv_core.dll.a'; then
            echo "error: tests.exe link still consumes OpenCV Core import library" >&2
            exit 1
          fi
          if printf '%s\n' "${link_cmd}" | grep -E '(^|[[:space:]])-lopencv_core([[:space:]]|$)'; then
            echo "error: tests.exe link still consumes OpenCV Core directly" >&2
            exit 1
          fi
          if printf '%s\n' "${link_cmd}" | grep -F 'libopencv_core_shim.a'; then
            echo "error: tests.exe link still consumes the static shim archive" >&2
            exit 1
          fi
          if ! printf '%s\n' "${link_cmd}" | grep -E '(^|[[:space:]])-lopencv_core_shim([[:space:]]|$)'; then
            echo "error: tests.exe link did not use shared shim linkage (-lopencv_core_shim)" >&2
            exit 1
          fi
          if printf '%s\n' "${link_cmd}" | grep -E '(^|[[:space:]])-lstdc\+\+([[:space:]]|$)'; then
            echo "error: tests.exe link still receives ordinary -lstdc++" >&2
            exit 1
          fi
          if ! printf '%s\n' "${link_cmd}" | grep -F -- '-static-libgcc'; then
            echo "error: tests.exe link does not contain -static-libgcc" >&2
            exit 1
          fi
          suffix_after_static=$(printf '%s\n' "${link_cmd}" | sed 's/.*-static-libgcc//')
          if printf '%s\n' "${suffix_after_static}" | grep -F -- '-shared-libgcc'; then
            echo "error: -shared-libgcc appears after -static-libgcc on the tests.exe link" >&2
            exit 1
          fi
          if ! printf '%s\n' "${link_cmd}" | grep -E -- 'libgnat\.a'; then
            echo "error: tests.exe link did not use static libgnat.a" >&2
            exit 1
          fi
          if ! printf '%s\n' "${link_cmd}" | grep -E -- 'libgnarl\.a'; then
            echo "error: tests.exe link did not use static libgnarl.a" >&2
            exit 1
          fi
          if printf '%s\n' "${link_cmd}" | grep -E '(^|[[:space:]/\\])g\+\+(\.exe)?([[:space:]]|$)'; then
            echo "error: tests.exe is still linked with g++ rather than gcc" >&2
            exit 1
          fi
          if grep -E '_gnu_exception_handler|__mingw_oldexcpt_handler|__mingw_initltssuo_force|__mingw_initltsdyn_force|__mingw_initltsdrot_force' "${log}"; then
            echo "error: MinGW CRT unresolved symbols reappeared" >&2
            exit 1
          fi

          echo "Test build and link checks completed successfully."

          test_exe=""
          for candidate in tests/bin/tests.exe tests/bin/tests; do
            if [ -e "${candidate}" ]; then
              test_exe="${candidate}"
              break
            fi
          done
          if [ -z "${test_exe}" ]; then
            echo "error: ${test_exe:-tests/bin/tests.exe} is missing after the static-runtime link" >&2
            ls -l tests/bin || true
            exit 1
          fi

          echo "=== tests.exe DLL dependencies before AUnit (${dump} -p) ==="
          deps=$(alr exec -- "${dump}" -p "${test_exe}" | grep -i 'DLL Name' || true)
          echo "${deps}"

          echo "=== Notable DLL imports ==="
          for name in libgcc_s_seh-1.dll libgnat-16.dll libgnarl-16.dll libstdc++-6.dll libopencv_core-500.dll libopencv_core_shim.dll; do
            if printf '%s\n' "${deps}" | grep -qi "${name}"; then
              echo "present: ${name}"
            else
              echo "absent: ${name}"
            fi
          done

          if ! printf '%s\n' "${deps}" | grep -qi 'opencv_core_shim'; then
            echo "error: test executable does not depend on the production shim DLL" >&2
            exit 1
          fi
          if printf '%s\n' "${deps}" | grep -qi 'libopencv_core-500.dll'; then
            echo "error: test executable still depends directly on OpenCV Core" >&2
            exit 1
          fi
          if printf '%s\n' "${deps}" | grep -qi 'libstdc++-6.dll'; then
            echo "error: test executable still imports libstdc++-6.dll" >&2
            exit 1
          fi
          if printf '%s\n' "${deps}" | grep -qi 'libgcc_s_seh-1.dll'; then
            echo "error: test executable still imports libgcc_s_seh-1.dll" >&2
            echo "static Ada/libgcc isolation did not take effect" >&2
            exit 1
          fi
          if printf '%s\n' "${deps}" | grep -qi 'libgnat-16.dll'; then
            echo "error: test executable still imports libgnat-16.dll" >&2
            exit 1
          fi
          if printf '%s\n' "${deps}" | grep -qi 'libgnarl-16.dll'; then
            echo "error: test executable still imports libgnarl-16.dll" >&2
            exit 1
          fi

          test_exe_win="${test_exe}"
          if command -v cygpath >/dev/null 2>&1; then
            test_exe_win=$(cygpath -wa "${test_exe}")
          fi
          echo "=== Absolute tests.exe path ==="
          printf '%s\n' "${test_exe_win}"
          echo "=== Absolute libopencv_core_shim.dll path ==="
          printf '%s\n' "${shim_dll_win}"
          echo "=== Effective runtime PATH prefixes ==="
          printf '%s\n' "${path_lib}"
          printf '%s\n' "${path_runtime}"

          set +e
          echo "=== Direct tests.exe execution ==="
          full_log="${PWD}/windows-aunit-full.log"
          set -o pipefail
          PATH="${windows_test_path}" "${test_exe}" 2>&1 | tee "${full_log}"
          testExitCode=${PIPESTATUS[0]}
          set +o pipefail
          echo "TESTS_EXE_EXIT_CODE=${testExitCode}"

          if [ "${testExitCode}" -ne 0 ]; then
            echo "=== tests.exe and shim PE imports after failure ==="
            alr exec -- "${dump}" -p "${test_exe}" | grep -i 'DLL Name' || true
            alr exec -- "${dump}" -p "${shim_dll}" | grep -i 'DLL Name' || true
            echo "=== Windows DLL resolution after failure ==="
            for name in libopencv_core_shim.dll libgcc_s_seh-1.dll libstdc++-6.dll libopencv_core-500.dll; do
              PATH="${windows_test_path}" where.exe "${name}" || true
            done
            echo "=== Recent Windows Application Error events ==="
            powershell.exe -NoProfile -Command "Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=(Get-Date).AddMinutes(-15)} -ErrorAction SilentlyContinue | Select-Object -First 20 TimeCreated, Id, ProviderName, Message | Format-List" || true
          fi

          echo "TESTS_EXE_EXIT_CODE=${testExitCode}"
          exit "${testExitCode}"

      - name: Upload full Windows AUnit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-aunit-full-log
          path: windows-aunit-full.log
          if-no-files-found: warn

      - name: Report Windows runtime diagnostics
        if: ${{ always() && steps.root-build.outcome == 'success' }}
        continue-on-error: true
        run: |
          set +e
          test_exe=""
          for candidate in tests/bin/tests.exe tests/bin/tests; do
            if [ -e "${candidate}" ]; then
              test_exe="${candidate}"
              break
            fi
          done
          if [ -z "${test_exe}" ]; then
            echo "warning: ${test_exe:-tests/bin/tests.exe} is missing" >&2
            ls -l tests/bin || true
            exit 0
          fi

          echo "=== Test executable ==="
          ls -l "${test_exe}" || echo "warning: ls failed for tests.exe"

          dump=""
          if alr exec -- which objdump >/dev/null 2>&1; then
            dump=objdump
          elif alr exec -- which x86_64-w64-mingw32-objdump >/dev/null 2>&1; then
            dump=x86_64-w64-mingw32-objdump
          fi
          if [ -z "${dump}" ]; then
            echo "warning: objdump is unavailable; skipping PE import dump"
            exit 0
          fi

          echo "=== DLL dependencies (${dump} -p) ==="
          deps=$(alr exec -- "${dump}" -p "${test_exe}" | grep -i 'DLL Name' || true)
          echo "${deps}"

          echo "=== Notable DLL imports ==="
          for name in libgcc_s_seh-1.dll libgnat-16.dll libgnarl-16.dll libstdc++-6.dll libopencv_core-500.dll libopencv_core_shim.dll; do
            if printf '%s\n' "${deps}" | grep -qi "${name}"; then
              echo "present: ${name}"
            else
              echo "absent: ${name}"
            fi
          done

          if ! printf '%s\n' "${deps}" | grep -qi 'opencv_core_shim'; then
            echo "warning: test executable does not depend on the production shim DLL"
          fi
          if printf '%s\n' "${deps}" | grep -qi 'libopencv_core-500.dll'; then
            echo "warning: test executable still depends directly on OpenCV Core"
          fi
          if printf '%s\n' "${deps}" | grep -qi 'libstdc++-6.dll'; then
            echo "warning: test executable still imports libstdc++-6.dll"
          fi
          if printf '%s\n' "${deps}" | grep -qi 'libgcc_s_seh-1.dll'; then
            echo "warning: test executable still imports libgcc_s_seh-1.dll"
          fi
          if printf '%s\n' "${deps}" | grep -qi 'libgnat-16.dll'; then
            echo "warning: test executable still imports libgnat-16.dll"
          fi
          if printf '%s\n' "${deps}" | grep -qi 'libgnarl-16.dll'; then
            echo "warning: test executable still imports libgnarl-16.dll"
          fi

      - name: Smoke test relocatable Ada library
        run: |
          set -eu
          OPENCV_CORE_LIBRARY_TYPE=relocatable alr -n build

          ada_dll=lib/libopencv_core_ada.dll
          if [ ! -f "${ada_dll}" ]; then
            echo "error: ${ada_dll} is missing" >&2
            ls -l lib || true
            exit 1
          fi

          dump=""
          if alr exec -- which objdump >/dev/null 2>&1; then
            dump=objdump
          elif alr exec -- which x86_64-w64-mingw32-objdump >/dev/null 2>&1; then
            dump=x86_64-w64-mingw32-objdump
          fi
          if [ -z "${dump}" ]; then
            echo "error: objdump is unavailable" >&2
            exit 1
          fi

          echo "=== Relocatable Ada library imports (${dump} -p) ==="
          deps=$(alr exec -- "${dump}" -p "${ada_dll}" | grep -i 'DLL Name' || true)
          echo "${deps}"
          if ! printf '%s\n' "${deps}" | grep -qi 'libopencv_core_shim.dll'; then
            echo "error: relocatable Ada library does not import libopencv_core_shim.dll" >&2
            exit 1
          fi
          if printf '%s\n' "${deps}" | grep -Eqi 'libopencv_core-[^[:space:]]*\.dll|libstdc\+\+-6\.dll|libgcc_s_seh-1\.dll'; then
            echo "error: relocatable Ada library has an unexpected direct OpenCV/C++ runtime import" >&2
            exit 1
          fi

          echo "=== GNAT/GNARL imports (allowed) ==="
          printf '%s\n' "${deps}" | grep -Ei 'libgnat|libgnarl' || echo "none"

          if [ ! -f obj/shim/external/opencv_core_shim.o ]; then
            echo "error: external shim object is missing after relocatable build" >&2
            exit 1
          fi
          unexpected_objects=$(find obj/shim -type f -name 'opencv_core_shim.o' ! -path 'obj/shim/external/opencv_core_shim.o' -print)
          if [ -n "${unexpected_objects}" ]; then
            echo "error: relocatable build independently produced another shim object" >&2
            printf '%s\n' "${unexpected_objects}"
            exit 1
          fi


