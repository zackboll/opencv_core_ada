name: OpenCV Compatibility

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: OpenCV 4.1
            container_dir: containers/debian12-opencv-4.1
            image: opencv-core-ci-4.1

          - name: OpenCV 4.6
            container_dir: containers/debian12-opencv-4.6
            image: opencv-core-ci-4.6

          - name: OpenCV 4.10
            container_dir: containers/debian13-opencv-4.10
            image: opencv-core-ci-4.10

          - name: OpenCV 5.0
            container_dir: containers/debian13-opencv-5.0
            image: opencv-core-ci-5.0

    name: ${{ matrix.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Alire dependencies
        uses: actions/cache@v4
        with:
          path: |
            .ci-cache/alire/releases
            .ci-cache/alire/builds
          key: alire-${{ matrix.image }}-${{ hashFiles('tests/alire.toml', 'tests/alire.lock') }}
          restore-keys: |
            alire-${{ matrix.image }}-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build compatibility image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.container_dir }}
          file: ${{ matrix.container_dir }}/Dockerfile
          load: true
          tags: ${{ matrix.image }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Verify OpenCV version
        run: |
          docker run --rm "${{ matrix.image }}" sh -c \
            'pkg-config --modversion opencv5 2>/dev/null || pkg-config --modversion opencv4 2>/dev/null || pkg-config --modversion opencv'

      - name: Run test suite
        run: |
          mkdir -p .ci-cache/alire/releases
          mkdir -p .ci-cache/alire/builds

          docker run --rm \
            -v "$PWD:/workspace" \
            -v "$PWD/.ci-cache/alire/releases:/root/.cache/alire/releases" \
            -v "$PWD/.ci-cache/alire/builds:/root/.cache/alire/builds" \
            -w /workspace \
            "${{ matrix.image }}" \
            alr -C tests run

  ubuntu-arm64:
    name: OpenCV Ubuntu 24.04 ARM64
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install OpenCV Core and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
          build-essential \
          ca-certificates \
          curl \
          git \
          libopencv-dev \
          pkg-config \
          unzip

      - name: Report architecture and OpenCV version
        run: |
          uname -m
          pkg-config --modversion opencv5 2>/dev/null || \
          pkg-config --modversion opencv4 2>/dev/null || \
          pkg-config --modversion opencv

      - name: Install Alire
        env:
          ALIRE_VERSION: "2.1.1"
        run: |
          curl -L \
            -o /tmp/alire.zip \
            "https://github.com/alire-project/alire/releases/download/v${ALIRE_VERSION}/alr-${ALIRE_VERSION}-bin-aarch64-linux.zip"
          unzip /tmp/alire.zip -d /tmp/alire
          sudo install -m 0755 /tmp/alire/bin/alr /usr/local/bin/alr
          rm -rf /tmp/alire /tmp/alire.zip
          alr --version

      - name: Select Ada toolchain
        run: |
          alr -n --force toolchain --select \
            gnat_native=16.1.0 \
            gprbuild=26.0.1
          alr toolchain

      - name: Run test suite
        run: alr -C tests run

  alire-ubuntu-lts:
    name: Alire Ubuntu LTS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Alire
        env:
          ALIRE_VERSION: "2.1.1"
        run: |
          curl -L \
            -o /tmp/alire.zip \
            "https://github.com/alire-project/alire/releases/download/v${ALIRE_VERSION}/alr-${ALIRE_VERSION}-bin-x86_64-linux.zip"
          unzip /tmp/alire.zip -d /tmp/alire
          mkdir -p "$PWD/alire_install/bin"
          install -m 0755 /tmp/alire/bin/alr "$PWD/alire_install/bin/alr"
          rm -rf /tmp/alire /tmp/alire.zip
          "$PWD/alire_install/bin/alr" version

      - name: Pull Alire Ubuntu LTS image
        run: docker pull ghcr.io/alire-project/docker/gnat:ubuntu-lts

      - name: Run test suite in Alire Ubuntu LTS image
        run: |
          docker run --rm \
            -e DEBIAN_FRONTEND=noninteractive \
            -v "$PWD:/workspace" \
            -v "$PWD/alire_install/bin/alr:/usr/bin/alr:ro" \
            -w /workspace \
            ghcr.io/alire-project/docker/gnat:ubuntu-lts \
            /bin/bash -c '
              set -eu

              echo "=== Environment ==="
              cat /etc/os-release
              uname -a
              uname -m

              gcc --version || true
              g++ --version || true
              gnat --version || true
              gprbuild --version || true
              pkg-config --version || echo "pkg-config is not installed yet"

              echo "=== Alire ==="
              command -v alr
              alr version

              echo "=== Install OpenCV development package ==="
              apt-get update
              apt-get install -y --no-install-recommends \
                libopencv-dev \
                pkg-config

              echo "=== OpenCV pkg-config ==="
              pkg-config --version
              if pkg-config --exists opencv5; then
                opencv_pkg=opencv5
              elif pkg-config --exists opencv4; then
                opencv_pkg=opencv4
              elif pkg-config --exists opencv; then
                opencv_pkg=opencv
              else
                echo "error: no OpenCV pkg-config package found" >&2
                exit 1
              fi
              echo "OpenCV pkg-config package: ${opencv_pkg}"
              pkg-config --modversion "${opencv_pkg}"
              pkg-config --cflags "${opencv_pkg}"
              pkg-config --libs "${opencv_pkg}"

              echo "=== Select Alire toolchain ==="
              alr -n --force toolchain --select \
                gnat_native=16.1.0 \
                gprbuild=26.0.1
              alr toolchain

              echo "=== Compiler visible inside Alire environment ==="
              alr exec -- which gnat
              alr exec -- gnat --version
              alr exec -- which gprbuild
              alr exec -- gprbuild --version

              echo "=== Build and test ==="
              alr -n build
              alr -n -C tests run
            '

  alire-fedora-latest:
    name: Alire Fedora Latest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Alire
        env:
          ALIRE_VERSION: "2.1.1"
        run: |
          curl -L \
            -o /tmp/alire.zip \
            "https://github.com/alire-project/alire/releases/download/v${ALIRE_VERSION}/alr-${ALIRE_VERSION}-bin-x86_64-linux.zip"
          unzip /tmp/alire.zip -d /tmp/alire
          mkdir -p "$PWD/alire_install/bin"
          install -m 0755 /tmp/alire/bin/alr "$PWD/alire_install/bin/alr"
          rm -rf /tmp/alire /tmp/alire.zip
          "$PWD/alire_install/bin/alr" version

      - name: Pull Alire Fedora Latest image
        run: docker pull ghcr.io/alire-project/docker/gnat:fedora-latest

      - name: Run test suite in Alire Fedora Latest image
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -v "$PWD/alire_install/bin/alr:/usr/bin/alr:ro" \
            -w /workspace \
            ghcr.io/alire-project/docker/gnat:fedora-latest \
            /bin/bash -c '
              set -eu

              git config --global --add safe.directory /workspace

              echo "=== Source being tested ==="
              git rev-parse HEAD
              git log -1 --oneline
              grep -n -A5 -B2 "Library_Type" opencv_core.gpr

              echo "=== Environment ==="
              cat /etc/os-release
              uname -a
              uname -m

              gcc --version || true
              g++ --version || true
              gnat --version || true
              gprbuild --version || true

              echo "=== Alire ==="
              command -v alr
              alr version

              echo "=== Install OpenCV development package ==="
              dnf install -y \
                opencv-devel \
                pkgconf-pkg-config \
                git

              echo "=== OpenCV pkg-config ==="
              pkg-config --version
              if pkg-config --exists opencv5; then
                opencv_pkg=opencv5
              elif pkg-config --exists opencv4; then
                opencv_pkg=opencv4
              elif pkg-config --exists opencv; then
                opencv_pkg=opencv
              else
                echo "error: no OpenCV pkg-config package found" >&2
                exit 1
              fi
              echo "OpenCV pkg-config package: ${opencv_pkg}"
              pkg-config --modversion "${opencv_pkg}"
              pkg-config --cflags "${opencv_pkg}"
              pkg-config --libs "${opencv_pkg}"

              echo "=== Select Alire toolchain ==="
              alr -n --force toolchain --select \
                gnat_native=16.1.0 \
                gprbuild=26.0.1
              alr toolchain

              echo "=== Compiler visible inside Alire environment ==="
              alr exec -- which gnat
              alr exec -- gnat --version
              alr exec -- which gprbuild
              alr exec -- gprbuild --version

              echo "=== Build ==="
              alr -n build

              echo "=== PIC diagnostic ==="
              shim_obj=$(find . -name opencv_core_shim.o | head -n 1 || true)
              if [ -n "${shim_obj}" ]; then
                echo "Found: ${shim_obj}"
                file "${shim_obj}"
                readelf -h "${shim_obj}" | grep -E "Class:|Data:|Type:|Machine:" || true
                readelf -rW "${shim_obj}" | grep -E "R_X86_64_32|R_X86_64_32S|R_X86_64_PC32" || true
              else
                echo "opencv_core_shim.o not found"
              fi

              echo "=== Test ==="
              alr -n -C tests run
            '

  macos-arm64:
    name: OpenCV macOS ARM64
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Report source and runner
        run: |
          set -eu
          echo "=== Source being tested ==="
          git rev-parse HEAD
          git log -1 --oneline
          echo "=== Runner ==="
          uname -a
          uname -m
          sw_vers

      - name: Set up Alire
        uses: alire-project/setup-alire@latest
        with:
          version: "2.1.1"
          toolchain: "gnat_native gprbuild"

      - name: Select and prove Ada toolchain
        run: |
          set -eu
          alr -n --force toolchain --select \
            gnat_native=16.1.0 \
            gprbuild=26.0.1

          echo "=== Alire ==="
          alr version
          alr toolchain

          echo "=== Compiler visible inside Alire environment ==="
          alr exec -- which gnat
          alr exec -- gnat --version
          alr exec -- which gprbuild
          alr exec -- gprbuild --version

          echo "=== C++ compiler inside Alire environment ==="
          alr exec -- which g++ || true
          alr exec -- g++ --version || true

          echo "=== Apple clang++ ==="
          xcrun --find clang++ || true
          xcrun clang++ --version || true

      - name: Install Homebrew OpenCV
        run: |
          set -eu
          brew install opencv

          echo "=== Homebrew prefixes ==="
          brew --prefix
          brew --prefix opencv

          echo "=== Homebrew OpenCV info ==="
          brew info opencv

      - name: Report Homebrew OpenCV and pkg-config
        run: |
          set -eu
          opencv_prefix="$(brew --prefix opencv)"
          brew_pkgconfig="$(brew --prefix)/lib/pkgconfig"
          opencv_pkgconfig="${opencv_prefix}/lib/pkgconfig"

          if [ -d "${brew_pkgconfig}" ]; then
            export PKG_CONFIG_PATH="${brew_pkgconfig}${PKG_CONFIG_PATH:+:${PKG_CONFIG_PATH}}"
          fi
          if [ -d "${opencv_pkgconfig}" ]; then
            export PKG_CONFIG_PATH="${opencv_pkgconfig}${PKG_CONFIG_PATH:+:${PKG_CONFIG_PATH}}"
          fi

          echo "PKG_CONFIG_PATH=${PKG_CONFIG_PATH:-}"
          echo "PKG_CONFIG_PATH=${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"

          echo "=== pkg-config ==="
          pkg-config --version

          if pkg-config --exists opencv5; then
            opencv_pkg=opencv5
          elif pkg-config --exists opencv4; then
            opencv_pkg=opencv4
          elif pkg-config --exists opencv; then
            opencv_pkg=opencv
          else
            echo "error: no OpenCV pkg-config package found" >&2
            echo "tried opencv5, opencv4, opencv" >&2
            pkg-config --list-all | grep -i opencv || true
            exit 1
          fi

          echo "selected OpenCV pkg-config package: ${opencv_pkg}"
          echo "OPENCV_PKG=${opencv_pkg}" >> "$GITHUB_ENV"
          pkg-config --modversion "${opencv_pkg}"
          pkg-config --cflags "${opencv_pkg}"
          pkg-config --libs "${opencv_pkg}"

          echo "=== Homebrew OpenCV libraries ==="
          ls -l "${opencv_prefix}/lib"

      - name: Inspect current project configuration
        run: |
          set -eu
          echo "=== opencv_core.gpr ==="
          cat opencv_core.gpr

          echo "=== Languages / library kind / C++ switches / linker options ==="
          grep -n -A12 -E 'Languages|Library_Type|Library_Kind|Default_Switches|"C\+\+"|Linker_Options|Use_Apple_Clang|Cxx_Driver|Cxx_Runtime|-lstdc\+\+|-lc\+\+|clang' opencv_core.gpr

      - name: Build current source
        id: root-build
        run: |
          set -eu
          alr -n build

      - name: Capture C++ ABI evidence
        if: always()
        continue-on-error: true
        run: |
          set +e
          set +o pipefail
          opencv_prefix="$(brew --prefix opencv 2>/dev/null || true)"
          echo "=== Homebrew OpenCV core library ==="
          echo "opencv prefix: ${opencv_prefix}"

          core_lib=""
          for candidate in \
            "${opencv_prefix}/lib/libopencv_core.dylib" \
            "${opencv_prefix}/lib"/libopencv_core.*.dylib
          do
            if [ -e "${candidate}" ]; then
              core_lib="${candidate}"
              break
            fi
          done

          if [ -z "${core_lib}" ]; then
            echo "libopencv_core*.dylib not found under ${opencv_prefix}/lib"
            ls -l "${opencv_prefix}/lib" 2>/dev/null || true
          else
            echo "Found: ${core_lib}"
            ls -l "${core_lib}"
            file "${core_lib}"
            echo "=== otool -L ==="
            otool -L "${core_lib}"
            echo "=== lipo -info ==="
            lipo -info "${core_lib}" 2>/dev/null || true

            echo "=== nm FileStorage / FileNode (defined globals, nm -gU) ==="
            nm -gU "${core_lib}" 2>/dev/null | grep -E 'FileStorage|FileNode' | c++filt || true
            echo "=== nm FileStorage / FileNode (nm -g) ==="
            nm -g "${core_lib}" 2>/dev/null | grep -E 'FileStorage|FileNode' | c++filt || true
            echo "=== nm std string ABI spelling in FileStorage / FileNode ==="
            nm -g "${core_lib}" 2>/dev/null | grep -E 'FileStorage|FileNode' | grep -E '__cxx11|__1|basic_string' | c++filt || true
          fi

      - name: Inspect C++ shim object
        if: always()
        continue-on-error: true
        run: |
          set +e
          set +o pipefail
          echo "=== opencv_core_shim.o ==="
          shim_obj="$(find . -name opencv_core_shim.o | head -n 1)"
          if [ -z "${shim_obj}" ]; then
            echo "opencv_core_shim.o not found"
            find . -name '*shim*' -print | head -n 50
          else
            echo "Found: ${shim_obj}"
            ls -l "${shim_obj}"
            file "${shim_obj}"

            echo "=== nm undefined symbols (FileStorage / FileNode / basic_string) ==="
            nm -u "${shim_obj}" 2>/dev/null | grep -E 'FileStorage|FileNode|basic_string|__cxx11|__1' || true
            echo "=== nm all matching symbols ==="
            nm "${shim_obj}" 2>/dev/null | grep -E 'FileStorage|FileNode|basic_string|__cxx11|__1' || true
            echo "=== demangled matching symbols ==="
            nm "${shim_obj}" 2>/dev/null | grep -E 'FileStorage|FileNode|basic_string|__cxx11|__1' | c++filt || true

            echo "=== std::__cxx11 vs std::__1 references in shim object ==="
            echo "std::__cxx11 count: $(nm "${shim_obj}" 2>/dev/null | grep -c '__cxx11' || true)"
            echo "std::__1 count: $(nm "${shim_obj}" 2>/dev/null | grep -c '__1' || true)"
          fi

      - name: Capture actual build/link command
        if: ${{ always() && steps.root-build.outcome != 'success' }}
        continue-on-error: true
        run: |
          set +e
          echo "=== Verbose GPRbuild for failed root build ==="
          alr -n build -- -v

      - name: Run test suite
        id: tests
        if: ${{ always() && steps.root-build.outcome == 'success' }}
        shell: bash
        run: |
          set +e
          alr -n -C tests run > "$RUNNER_TEMP/opencv-test-run.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/opencv-test-run.log"
          exit "$status"

      - name: Upload macOS test run diagnostics
        if: ${{ always() && steps.root-build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: macos-test-run-diagnostics
          path: ${{ runner.temp }}/opencv-test-run.log
          if-no-files-found: error

      - name: Capture macOS crash backtrace
        if: ${{ always() && steps.tests.outcome == 'failure' }}
        continue-on-error: true
        shell: bash
        run: |
          set +e
          {
            echo "=== LLDB location ==="
            xcrun --find lldb
            echo
            echo "=== LLDB crash backtrace ==="
            xcrun lldb --batch \
              -o "breakpoint set --name abort" \
              -o run \
              -o "thread backtrace all" \
              -- tests/bin/tests
          } > "$RUNNER_TEMP/opencv-test-crash-backtrace.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/opencv-test-crash-backtrace.log"
          exit "$status"

      - name: Upload macOS crash backtrace
        if: ${{ always() && steps.tests.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: macos-test-crash-backtrace
          path: ${{ runner.temp }}/opencv-test-crash-backtrace.log
          if-no-files-found: error

      - name: Capture macOS C++ runtime diagnostics
        if: ${{ always() && steps.tests.outcome == 'failure' }}
        continue-on-error: true
        shell: bash
        run: |
          set +e
          {
            echo "=== Executable dynamic dependencies ==="
            otool -L tests/bin/tests
            echo

            echo "=== OpenCV core dynamic dependencies ==="
            opencv_prefix="$(brew --prefix opencv 2>/dev/null || true)"
            opencv_core_dylib=""
            for candidate in \
              "${opencv_prefix}/lib/libopencv_core.dylib" \
              "${opencv_prefix}/lib"/libopencv_core.*.dylib
            do
              if [ -e "${candidate}" ]; then
                opencv_core_dylib="${candidate}"
                break
              fi
            done
            if [ -z "${opencv_core_dylib}" ]; then
              echo "libopencv_core*.dylib not found under ${opencv_prefix}/lib"
              ls -l "${opencv_prefix}/lib" 2>/dev/null || true
            else
              echo "Found: ${opencv_core_dylib}"
              otool -L "${opencv_core_dylib}"
            fi
            echo

            echo "=== Exception symbols in final executable ==="
            nm -m tests/bin/tests | grep -E '(__gxx_personality_v0|_Unwind_|__cxa_)' || true
            echo

            echo "=== Exception symbols referenced by OpenCV Ada archive ==="
            nm -u lib/libopencv_core_ada.a | grep -E '(__gxx_personality_v0|_Unwind_|__cxa_)' || true
            echo

            echo "=== LLDB runtime symbol ownership ==="
            xcrun lldb --batch \
              -o "breakpoint set --name abort" \
              -o run \
              -o "image lookup -n __gxx_personality_v0" \
              -o "image lookup -n _Unwind_RaiseException" \
              -o "image lookup -n __cxa_throw" \
              -o "image lookup -n __cxa_begin_catch" \
              -- tests/bin/tests
          } > "$RUNNER_TEMP/opencv-cxx-runtime.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/opencv-cxx-runtime.log"
          exit "$status"

      - name: Upload macOS C++ runtime diagnostics
        if: ${{ always() && steps.tests.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: macos-cxx-runtime-diagnostics
          path: ${{ runner.temp }}/opencv-cxx-runtime.log
          if-no-files-found: error

      - name: Compare macOS shim exception links
        if: ${{ always() && steps.tests.outcome == 'failure' }}
        continue-on-error: true
        shell: bash
        run: |
          set +e
          {
            echo "=== Tool locations ==="
            clang_c="$(xcrun --find clang)"
            clang_cxx="$(xcrun --find clang++)"
            gnat_gcc="$(alr exec -- which gcc 2>/dev/null | tail -n 1)"
            opencv_prefix="$(brew --prefix opencv)"
            macos_sdk_root="$(xcrun --sdk macosx --show-sdk-path)"

            echo "clang: ${clang_c}"
            echo "clang++: ${clang_cxx}"
            echo "GNAT gcc: ${gnat_gcc}"
            echo "OpenCV: ${opencv_prefix}"
            echo "macOS SDK: ${macos_sdk_root}"
            echo

            driver="$RUNNER_TEMP/opencv-shim-exception-driver.c"
            driver_obj="$RUNNER_TEMP/opencv-shim-exception-driver.o"

            cat > "${driver}" <<'EOF'
          #include "opencv_core_shim.h"

          #include <stddef.h>
          #include <stdint.h>
          #include <stdio.h>

          int main(void)
          {
              opencv_core_mat_handle *source = NULL;
              opencv_core_mat_handle *view = NULL;
              opencv_core_mat_handle *reshaped = NULL;
              opencv_core_status status;
              uint8_t is_continuous = 1;
              int result = 1;

              status = opencv_core_mat_create_2d(
                  4, 5,
                  OPENCV_CORE_DEPTH_UINT8,
                  1,
                  &source);

              if (status != OPENCV_CORE_OK) {
                  printf("create status=%d error=%s\n",
                         (int)status,
                         opencv_core_last_error_message());
                  goto cleanup;
              }

              status = opencv_core_mat_region(
                  source,
                  1, 1,
                  3, 2,
                  &view);

              if (status != OPENCV_CORE_OK) {
                  printf("region status=%d error=%s\n",
                         (int)status,
                         opencv_core_last_error_message());
                  goto cleanup;
              }

              status = opencv_core_mat_is_continuous(
                  view,
                  &is_continuous);

              if (status != OPENCV_CORE_OK) {
                  printf("is_continuous status=%d error=%s\n",
                         (int)status,
                         opencv_core_last_error_message());
                  goto cleanup;
              }

              printf("view is_continuous=%u\n",
                     (unsigned)is_continuous);
              printf("calling opencv_core_mat_reshape...\n");
              fflush(stdout);

              status = opencv_core_mat_reshape(
                  view,
                  1,
                  1,
                  &reshaped);

              printf("reshape returned status=%d\n",
                     (int)status);
              printf("last error=%s\n",
                     opencv_core_last_error_message());

              if (is_continuous == 0 &&
                  status == OPENCV_CORE_ERROR_OPENCV) {
                  result = 0;
              }

          cleanup:
              opencv_core_mat_destroy(reshaped);
              opencv_core_mat_destroy(view);
              opencv_core_mat_destroy(source);

              printf("driver result=%d\n", result);
              return result;
          }
          EOF

            echo "=== Driver source ==="
            cat "${driver}"
            echo

            echo "=== Compile common C driver object ==="
            "${clang_c}" \
              -isysroot "${macos_sdk_root}" \
              -Icpp \
              -c "${driver}" \
              -o "${driver_obj}"
            compile_status=$?
            echo "compile exit=${compile_status}"
            echo

            if [ "${compile_status}" -ne 0 ]; then
              echo "Driver compilation failed; skipping link comparisons."
              exit "${compile_status}"
            fi

            common_archive="lib/libopencv_core_ada.a"

            echo "=== A: link with Apple clang++ ==="
            "${clang_cxx}" \
              -isysroot "${macos_sdk_root}" \
              "${driver_obj}" \
              "${common_archive}" \
              -L"${opencv_prefix}/lib" \
              -lopencv_core \
              -lc++ \
              -Wl,-rpath,"${opencv_prefix}/lib" \
              -o "$RUNNER_TEMP/shim-exception-clang"
            clang_link_status=$?
            echo "clang++ link exit=${clang_link_status}"

            if [ "${clang_link_status}" -eq 0 ]; then
              "$RUNNER_TEMP/shim-exception-clang"
              clang_run_status=$?
              echo "clang++ linked run exit=${clang_run_status}"
            else
              clang_run_status=255
            fi
            echo

            echo "=== B: link with GNAT gcc ==="
            "${gnat_gcc}" \
              "${driver_obj}" \
              "${common_archive}" \
              -L"${opencv_prefix}/lib" \
              -lopencv_core \
              -lc++ \
              -Wl,-rpath,"${opencv_prefix}/lib" \
              -o "$RUNNER_TEMP/shim-exception-gnat"
            gnat_link_status=$?
            echo "GNAT gcc link exit=${gnat_link_status}"

            if [ "${gnat_link_status}" -eq 0 ]; then
              "$RUNNER_TEMP/shim-exception-gnat"
              gnat_run_status=$?
              echo "GNAT gcc linked run exit=${gnat_run_status}"
            else
              gnat_run_status=255
            fi
            echo

            echo "=== C: link with GNAT gcc + -static-libgcc ==="
            "${gnat_gcc}" \
              "${driver_obj}" \
              "${common_archive}" \
              -L"${opencv_prefix}/lib" \
              -lopencv_core \
              -lc++ \
              -static-libgcc \
              -Wl,-rpath,"${opencv_prefix}/lib" \
              -o "$RUNNER_TEMP/shim-exception-gnat-static-libgcc"
            gnat_static_link_status=$?
            echo "GNAT gcc + -static-libgcc link exit=${gnat_static_link_status}"

            if [ "${gnat_static_link_status}" -eq 0 ]; then
              "$RUNNER_TEMP/shim-exception-gnat-static-libgcc"
              gnat_static_run_status=$?
              echo "GNAT gcc + -static-libgcc linked run exit=${gnat_static_run_status}"
            else
              gnat_static_run_status=255
            fi
            echo

            echo "=== D: link with GNAT gcc + macOS SDK ==="
            "${gnat_gcc}" \
              -isysroot "${macos_sdk_root}" \
              "${driver_obj}" \
              "${common_archive}" \
              -L"${opencv_prefix}/lib" \
              -lopencv_core \
              -lc++ \
              -Wl,-rpath,"${opencv_prefix}/lib" \
              -o "$RUNNER_TEMP/shim-exception-gnat-sdk"
            gnat_sdk_link_status=$?
            echo "GNAT gcc + SDK link exit=${gnat_sdk_link_status}"

            if [ "${gnat_sdk_link_status}" -eq 0 ]; then
              "$RUNNER_TEMP/shim-exception-gnat-sdk"
              gnat_sdk_run_status=$?
              echo "GNAT gcc + SDK linked run exit=${gnat_sdk_run_status}"
            else
              gnat_sdk_run_status=255
            fi
            echo

            echo "=== E: link with GNAT gcc + classic Apple linker ==="
            "${gnat_gcc}" \
              "${driver_obj}" \
              "${common_archive}" \
              -L"${opencv_prefix}/lib" \
              -lopencv_core \
              -lc++ \
              -Wl,-rpath,"${opencv_prefix}/lib" \
              -Wl,-ld_classic \
              -o "$RUNNER_TEMP/shim-exception-gnat-classic"
            gnat_classic_link_status=$?
            echo "GNAT gcc + ld_classic link exit=${gnat_classic_link_status}"

            if [ "${gnat_classic_link_status}" -eq 0 ]; then
              "$RUNNER_TEMP/shim-exception-gnat-classic"
              gnat_classic_run_status=$?
              echo "GNAT gcc + ld_classic linked run exit=${gnat_classic_run_status}"
            else
              gnat_classic_run_status=255
            fi
            echo

            echo "=== F: GNAT gcc without automatic -no_compact_unwind ==="
            "${gnat_gcc}" \
              -v \
              -nodefaultlibs \
              "${driver_obj}" \
              "${common_archive}" \
              -L"${opencv_prefix}/lib" \
              -lemutls_w \
              -lheapt_w \
              -lopencv_core \
              -lc++ \
              -Wl,-rpath,"${opencv_prefix}/lib" \
              -lgcc \
              -lSystem \
              -o "$RUNNER_TEMP/shim-exception-gnat-compact"
            gnat_compact_link_status=$?
            echo "GNAT gcc compact-unwind candidate link exit=${gnat_compact_link_status}"

            if [ "${gnat_compact_link_status}" -eq 0 ]; then
              "$RUNNER_TEMP/shim-exception-gnat-compact"
              gnat_compact_run_status=$?
              echo "GNAT gcc compact-unwind candidate run exit=${gnat_compact_run_status}"
            else
              gnat_compact_run_status=255
            fi
            echo

            original_specs="$RUNNER_TEMP/gnat-original.specs"
            compact_specs="$RUNNER_TEMP/gnat-compact.specs"

            echo "=== GNAT GCC Darwin specs ==="
            "${gnat_gcc}" -dumpspecs > "${original_specs}"
            grep -n "no_compact_unwind" "${original_specs}" || true
            echo

            python3 - "${original_specs}" "${compact_specs}" <<'PY'
          from pathlib import Path
          import sys

          src = Path(sys.argv[1])
          dst = Path(sys.argv[2])

          text = src.read_text()

          needle = "%:version-compare(>= 10.6 mmacosx-version-min= -no_compact_unwind)"
          count = text.count(needle)

          print(f"no_compact_unwind spec occurrences={count}")

          if count != 1:
              raise SystemExit(42)

          dst.write_text(text.replace(needle, "", 1))
          PY
            spec_edit_status=$?
            echo "custom specs edit exit=${spec_edit_status}"
            echo

            gnat_specs_link_status=255
            gnat_specs_run_status=255

            if [ "${spec_edit_status}" -eq 0 ]; then
              echo "=== Modified GNAT GCC specs no_compact_unwind matches ==="
              grep -n "no_compact_unwind" "${compact_specs}" || true
              echo

              echo "=== G: GNAT gcc with no-compact-unwind spec removed ==="
              "${gnat_gcc}" \
                -v \
                -specs="${compact_specs}" \
                "${driver_obj}" \
                "${common_archive}" \
                -L"${opencv_prefix}/lib" \
                -lopencv_core \
                -lc++ \
                -Wl,-rpath,"${opencv_prefix}/lib" \
                -o "$RUNNER_TEMP/shim-exception-gnat-specs"
              gnat_specs_link_status=$?
              echo "GNAT gcc custom-specs link exit=${gnat_specs_link_status}"

              if [ "${gnat_specs_link_status}" -eq 0 ]; then
                "$RUNNER_TEMP/shim-exception-gnat-specs"
                gnat_specs_run_status=$?
                echo "GNAT gcc custom-specs run exit=${gnat_specs_run_status}"
              else
                gnat_specs_run_status=255
              fi
              echo
            else
              echo "=== G skipped ==="
              echo "custom specs occurrence count was not exactly 1"
              echo
            fi

            gnat_sysroot="$("${gnat_gcc}" -print-sysroot)"
            echo "GNAT GCC sysroot: ${gnat_sysroot}"
            echo

            gnat_specs_sysroot_link_status=255
            gnat_specs_sysroot_run_status=255

            if [ "${spec_edit_status}" -eq 0 ]; then
              if [ -n "${gnat_sysroot}" ]; then
                echo "=== H: GNAT gcc custom specs + restored syslibroot ==="
                "${gnat_gcc}" \
                  -v \
                  -specs="${compact_specs}" \
                  "${driver_obj}" \
                  "${common_archive}" \
                  -L"${opencv_prefix}/lib" \
                  -lopencv_core \
                  -lc++ \
                  -Wl,-syslibroot,"${gnat_sysroot}" \
                  -Wl,-rpath,"${opencv_prefix}/lib" \
                  -o "$RUNNER_TEMP/shim-exception-gnat-specs-sysroot"
                gnat_specs_sysroot_link_status=$?
                echo "GNAT gcc custom-specs + syslibroot link exit=${gnat_specs_sysroot_link_status}"

                if [ "${gnat_specs_sysroot_link_status}" -eq 0 ]; then
                  "$RUNNER_TEMP/shim-exception-gnat-specs-sysroot"
                  gnat_specs_sysroot_run_status=$?
                  echo "GNAT gcc custom-specs + syslibroot run exit=${gnat_specs_sysroot_run_status}"
                else
                  gnat_specs_sysroot_run_status=255
                fi
                echo
              else
                echo "=== H skipped ==="
                echo "GNAT GCC sysroot is empty"
                echo
              fi
            else
              echo "=== H skipped ==="
              echo "custom specs edit did not succeed"
              echo
            fi

            echo "=== Summary ==="
            echo "clang++ link=${clang_link_status} run=${clang_run_status}"
            echo "GNAT gcc link=${gnat_link_status} run=${gnat_run_status}"
            echo "GNAT gcc static-libgcc link=${gnat_static_link_status} run=${gnat_static_run_status}"
            echo "GNAT gcc + SDK link=${gnat_sdk_link_status} run=${gnat_sdk_run_status}"
            echo "GNAT gcc + ld_classic link=${gnat_classic_link_status} run=${gnat_classic_run_status}"
            echo "GNAT gcc compact-unwind candidate link=${gnat_compact_link_status} run=${gnat_compact_run_status}"
            echo "GNAT gcc custom-specs compact-unwind link=${gnat_specs_link_status} run=${gnat_specs_run_status}"
            echo "custom specs edit=${spec_edit_status}"
            echo "GNAT gcc custom-specs + syslibroot link=${gnat_specs_sysroot_link_status} run=${gnat_specs_sysroot_run_status}"
            echo "GNAT GCC sysroot=${gnat_sysroot}"

            echo "=== Apple clang++ verbose link ==="
            "${clang_cxx}" \
              -v \
              -isysroot "${macos_sdk_root}" \
              "${driver_obj}" \
              "${common_archive}" \
              -L"${opencv_prefix}/lib" \
              -lopencv_core \
              -lc++ \
              -Wl,-rpath,"${opencv_prefix}/lib" \
              -o "$RUNNER_TEMP/shim-exception-clang-verbose"
            clang_verbose_link_status=$?
            echo "clang++ verbose link exit=${clang_verbose_link_status}"
            echo

            echo "=== GNAT gcc verbose link ==="
            "${gnat_gcc}" \
              -v \
              "${driver_obj}" \
              "${common_archive}" \
              -L"${opencv_prefix}/lib" \
              -lopencv_core \
              -lc++ \
              -Wl,-rpath,"${opencv_prefix}/lib" \
              -o "$RUNNER_TEMP/shim-exception-gnat-verbose"
            gnat_verbose_link_status=$?
            echo "GNAT gcc verbose link exit=${gnat_verbose_link_status}"
            echo

            llvm_objdump="$(xcrun --find llvm-objdump 2>/dev/null || true)"

            echo "=== Mach-O inspection tools ==="
            echo "otool: $(command -v otool || true)"
            echo "nm: $(command -v nm || true)"
            echo "llvm-objdump: ${llvm_objdump}"
            echo

            echo "=== A: Mach-O file/dependencies ==="
            file "$RUNNER_TEMP/shim-exception-clang"
            otool -L "$RUNNER_TEMP/shim-exception-clang"
            echo

            echo "=== B: Mach-O file/dependencies ==="
            file "$RUNNER_TEMP/shim-exception-gnat"
            otool -L "$RUNNER_TEMP/shim-exception-gnat"
            echo

            echo "=== A: Mach-O load commands and sections ==="
            otool -l "$RUNNER_TEMP/shim-exception-clang"
            echo

            echo "=== B: Mach-O load commands and sections ==="
            otool -l "$RUNNER_TEMP/shim-exception-gnat"
            echo

            a_unwind_status=255
            b_unwind_status=255
            if [ -n "${llvm_objdump}" ]; then
              echo "=== A: llvm-objdump unwind info ==="
              "${llvm_objdump}" --unwind-info "$RUNNER_TEMP/shim-exception-clang"
              a_unwind_status=$?
              echo "A unwind dump exit=${a_unwind_status}"
              echo

              echo "=== B: llvm-objdump unwind info ==="
              "${llvm_objdump}" --unwind-info "$RUNNER_TEMP/shim-exception-gnat"
              b_unwind_status=$?
              echo "B unwind dump exit=${b_unwind_status}"
              echo
            else
              echo "=== llvm-objdump unwind info skipped ==="
              echo "llvm-objdump not found"
              echo
            fi

            echo "=== A: nm -m ==="
            nm -m "$RUNNER_TEMP/shim-exception-clang"
            echo

            echo "=== B: nm -m ==="
            nm -m "$RUNNER_TEMP/shim-exception-gnat"
            echo

            f_unwind_status=255
            if [ "${gnat_compact_link_status}" -eq 0 ]; then
              echo "=== F: Mach-O load commands and sections ==="
              otool -l "$RUNNER_TEMP/shim-exception-gnat-compact"
              echo

              echo "=== F: dependencies ==="
              otool -L "$RUNNER_TEMP/shim-exception-gnat-compact"
              echo

              if [ -n "${llvm_objdump}" ]; then
                echo "=== F: llvm-objdump unwind info ==="
                "${llvm_objdump}" \
                  --unwind-info \
                  "$RUNNER_TEMP/shim-exception-gnat-compact"
                f_unwind_status=$?
                echo "F unwind dump exit=${f_unwind_status}"
                echo
              else
                echo "=== F: llvm-objdump unwind info skipped ==="
                echo "llvm-objdump not found"
                echo
              fi
            else
              echo "=== F Mach-O inspection skipped ==="
              echo "F did not link"
              echo
            fi

            g_unwind_status=255
            if [ "${gnat_specs_link_status}" -eq 0 ]; then
              echo "=== G: dependencies ==="
              otool -L "$RUNNER_TEMP/shim-exception-gnat-specs"
              echo

              echo "=== G: Mach-O load commands and sections ==="
              otool -l "$RUNNER_TEMP/shim-exception-gnat-specs"
              echo

              if [ -n "${llvm_objdump}" ]; then
                echo "=== G: llvm-objdump unwind info ==="
                "${llvm_objdump}" \
                  --unwind-info \
                  "$RUNNER_TEMP/shim-exception-gnat-specs"
                g_unwind_status=$?
                echo "G unwind dump exit=${g_unwind_status}"
                echo
              else
                echo "=== G: llvm-objdump unwind info skipped ==="
                echo "llvm-objdump not found"
                echo
              fi
            else
              echo "=== G Mach-O inspection skipped ==="
              echo "G did not link"
              echo
            fi

            h_unwind_status=255
            if [ "${gnat_specs_sysroot_link_status}" -eq 0 ]; then
              echo "=== H: dependencies ==="
              otool -L "$RUNNER_TEMP/shim-exception-gnat-specs-sysroot"
              echo

              echo "=== H: Mach-O load commands and sections ==="
              otool -l "$RUNNER_TEMP/shim-exception-gnat-specs-sysroot"
              echo

              if [ -n "${llvm_objdump}" ]; then
                echo "=== H: llvm-objdump unwind info ==="
                "${llvm_objdump}" \
                  --unwind-info \
                  "$RUNNER_TEMP/shim-exception-gnat-specs-sysroot"
                h_unwind_status=$?
                echo "H unwind dump exit=${h_unwind_status}"
                echo
              else
                echo "=== H: llvm-objdump unwind info skipped ==="
                echo "llvm-objdump not found"
                echo
              fi
            else
              echo "=== H Mach-O inspection skipped ==="
              echo "H did not link"
              echo
            fi

            echo "clang++ verbose link=${clang_verbose_link_status}"
            echo "GNAT gcc verbose link=${gnat_verbose_link_status}"
            echo "A unwind dump=${a_unwind_status}"
            echo "B unwind dump=${b_unwind_status}"
            echo "F unwind dump=${f_unwind_status}"
            echo "G unwind dump=${g_unwind_status}"
            echo "H unwind dump=${h_unwind_status}"
          } > "$RUNNER_TEMP/opencv-shim-link-comparison.log" 2>&1

          status=$?
          cat "$RUNNER_TEMP/opencv-shim-link-comparison.log"
          exit "$status"

      - name: Upload macOS shim link comparison
        if: ${{ always() && steps.tests.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: macos-shim-link-comparison
          path: ${{ runner.temp }}/opencv-shim-link-comparison.log
          if-no-files-found: error

      - name: Capture actual test build/link command
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          alr -n -C tests build -- -v > "$RUNNER_TEMP/opencv-test-link.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/opencv-test-link.log"
          exit "$status"

      - name: Upload macOS test link diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-test-link-diagnostics
          path: ${{ runner.temp }}/opencv-test-link.log
          if-no-files-found: error

      - name: Compare real Ada tests with compact-unwind specs
        id: ada-compact-unwind
        if: ${{ always() && steps.root-build.outcome == 'success' }}
        shell: bash
        run: |
          set +e
          {
            echo "=== Tool locations ==="
            gnat_gcc="$(alr -n -C tests exec -- which gcc 2>/dev/null | tail -n 1)"
            macos_sdk_root="$(xcrun --sdk macosx --show-sdk-path)"
            gnat_sysroot="$("${gnat_gcc}" -print-sysroot 2>/dev/null)"
            llvm_objdump="$(xcrun --find llvm-objdump 2>/dev/null || true)"
            echo "GNAT gcc: ${gnat_gcc}"
            echo "macOS SDK: ${macos_sdk_root}"
            echo "GNAT GCC sysroot: ${gnat_sysroot}"
            echo "llvm-objdump: ${llvm_objdump}"
            echo

            original_specs="$RUNNER_TEMP/gnat-ada-original.specs"
            compact_specs="$RUNNER_TEMP/gnat-ada-compact.specs"

            echo "=== GNAT GCC Darwin specs ==="
            "${gnat_gcc}" -dumpspecs > "${original_specs}"
            grep -n "no_compact_unwind" "${original_specs}" || true
            echo

            python3 - "${original_specs}" "${compact_specs}" <<'PY'
          from pathlib import Path
          import sys

          src = Path(sys.argv[1])
          dst = Path(sys.argv[2])

          text = src.read_text()

          needle = "%:version-compare(>= 10.6 mmacosx-version-min= -no_compact_unwind)"
          count = text.count(needle)

          print(f"no_compact_unwind spec occurrences={count}")

          if count != 1:
              raise SystemExit(42)

          dst.write_text(text.replace(needle, "", 1))
          PY
            spec_edit_status=$?
            echo "custom specs edit exit=${spec_edit_status}"
            echo

            if [ "${spec_edit_status}" -ne 0 ]; then
              echo "=== Ada compact-unwind experiment skipped ==="
              echo "custom specs occurrence count was not exactly 1"
              exit 42
            fi

            echo "=== Modified GNAT GCC specs no_compact_unwind matches ==="
            grep -n "no_compact_unwind" "${compact_specs}" || true
            echo

            if [ -z "${macos_sdk_root}" ]; then
              echo "=== Ada compact-unwind experiment skipped ==="
              echo "macOS SDK root from xcrun is empty"
              exit 255
            fi

            echo "=== Remove existing tests executable to force relink ==="
            rm -f tests/bin/tests tests/bin/test
            echo

            echo "=== Build real tests executable with custom specs and SDK sysroot ==="
            alr -n -C tests build -- \
              -v \
              -largs \
              "-specs=${compact_specs}" \
              "-Wl,-syslibroot,${macos_sdk_root}"
            ada_link_status=$?
            echo "Ada tests custom-specs link exit=${ada_link_status}"
            echo

            test_exe=""
            for candidate in tests/bin/tests tests/bin/test; do
              if [ -e "${candidate}" ]; then
                test_exe="${candidate}"
                break
              fi
            done

            ada_run_status=255
            ada_unwind_status=255

            if [ "${ada_link_status}" -ne 0 ]; then
              echo "=== Ada tests custom-specs run skipped ==="
              echo "link failed"
            elif [ -z "${test_exe}" ]; then
              echo "=== Ada tests custom-specs run skipped ==="
              echo "test executable not found"
              ls -l tests/bin
              ada_link_status=255
            else
              echo "=== Test executable ==="
              echo "Found: ${test_exe}"
              ls -l "${test_exe}"
              file "${test_exe}"
              echo

              echo "=== Ada tests dependencies ==="
              otool -L "${test_exe}"
              echo

              echo "=== Ada tests Mach-O load commands and sections ==="
              otool -l "${test_exe}"
              echo

              if [ -n "${llvm_objdump}" ]; then
                echo "=== Ada tests llvm-objdump unwind info ==="
                "${llvm_objdump}" --unwind-info "${test_exe}"
                ada_unwind_status=$?
                echo "Ada tests unwind dump exit=${ada_unwind_status}"
                echo
              else
                echo "=== Ada tests llvm-objdump unwind info skipped ==="
                echo "llvm-objdump not found"
                echo
              fi

              echo "=== Run real AUnit tests executable ==="
              "${test_exe}"
              ada_run_status=$?
              echo "Ada tests custom-specs run exit=${ada_run_status}"
              echo
            fi

            echo "=== Summary ==="
            echo "custom specs edit=${spec_edit_status}"
            echo "macOS SDK=${macos_sdk_root}"
            echo "GNAT GCC sysroot=${gnat_sysroot}"
            echo "Ada tests custom-specs link=${ada_link_status} run=${ada_run_status}"
            echo "Ada tests unwind dump=${ada_unwind_status}"

            if [ "${ada_link_status}" -ne 0 ]; then
              exit "${ada_link_status}"
            fi
            exit "${ada_run_status}"
          } > "$RUNNER_TEMP/opencv-ada-compact-unwind.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/opencv-ada-compact-unwind.log"
          exit "$status"

      - name: Upload macOS Ada compact-unwind diagnostics
        if: ${{ always() && steps.root-build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: macos-ada-compact-unwind-diagnostics
          path: ${{ runner.temp }}/opencv-ada-compact-unwind.log
          if-no-files-found: error

      - name: Inspect linked test executable
        if: ${{ always() && steps.tests.outcome == 'success' }}
        continue-on-error: true
        run: |
          set +e
          set +o pipefail

          echo "=== generated OpenCV install configuration ==="
          cat config/opencv_core_install.gpr

          echo "=== test executable ==="
          test_exe=""
          for candidate in tests/bin/tests tests/bin/test; do
            if [ -e "${candidate}" ]; then
              test_exe="${candidate}"
              break
            fi
          done

          if [ -z "${test_exe}" ]; then
            echo "test executable not found"
            ls -l tests/bin
            exit 0
          fi

          echo "Found: ${test_exe}"
          ls -l "${test_exe}"
          file "${test_exe}"

          echo "=== otool -L ==="
          otool -L "${test_exe}"

          echo "=== libc++ vs libstdc++ ==="
          echo "libc++ lines:"
          otool -L "${test_exe}" | grep -E 'libc\+\+' || true
          echo "libstdc++ lines:"
          otool -L "${test_exe}" | grep -E 'libstdc\+\+' || true