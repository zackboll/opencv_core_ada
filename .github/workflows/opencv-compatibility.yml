name: OpenCV Compatibility

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: OpenCV 4.1
            container_dir: containers/debian12-opencv-4.1
            image: opencv-core-ci-4.1

          - name: OpenCV 4.6
            container_dir: containers/debian12-opencv-4.6
            image: opencv-core-ci-4.6

          - name: OpenCV 4.10
            container_dir: containers/debian13-opencv-4.10
            image: opencv-core-ci-4.10

          - name: OpenCV 5.0
            container_dir: containers/debian13-opencv-5.0
            image: opencv-core-ci-5.0

    name: ${{ matrix.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Alire dependencies
        uses: actions/cache@v4
        with:
          path: |
            .ci-cache/alire/releases
            .ci-cache/alire/builds
          key: alire-${{ matrix.image }}-${{ hashFiles('tests/alire.toml', 'tests/alire.lock') }}
          restore-keys: |
            alire-${{ matrix.image }}-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build compatibility image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.container_dir }}
          file: ${{ matrix.container_dir }}/Dockerfile
          load: true
          tags: ${{ matrix.image }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Verify OpenCV version
        run: |
          docker run --rm "${{ matrix.image }}" sh -c \
            'pkg-config --modversion opencv5 2>/dev/null || pkg-config --modversion opencv4 2>/dev/null || pkg-config --modversion opencv'

      - name: Run test suite
        run: |
          mkdir -p .ci-cache/alire/releases
          mkdir -p .ci-cache/alire/builds

          docker run --rm \
            -v "$PWD:/workspace" \
            -v "$PWD/.ci-cache/alire/releases:/root/.cache/alire/releases" \
            -v "$PWD/.ci-cache/alire/builds:/root/.cache/alire/builds" \
            -w /workspace \
            "${{ matrix.image }}" \
            alr -C tests run

  ubuntu-arm64:
    name: OpenCV Ubuntu 24.04 ARM64
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install OpenCV Core and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
          build-essential \
          ca-certificates \
          curl \
          git \
          libopencv-dev \
          pkg-config \
          unzip

      - name: Report architecture and OpenCV version
        run: |
          uname -m
          pkg-config --modversion opencv5 2>/dev/null || \
          pkg-config --modversion opencv4 2>/dev/null || \
          pkg-config --modversion opencv

      - name: Install Alire
        env:
          ALIRE_VERSION: "2.1.1"
        run: |
          curl -L \
            -o /tmp/alire.zip \
            "https://github.com/alire-project/alire/releases/download/v${ALIRE_VERSION}/alr-${ALIRE_VERSION}-bin-aarch64-linux.zip"
          unzip /tmp/alire.zip -d /tmp/alire
          sudo install -m 0755 /tmp/alire/bin/alr /usr/local/bin/alr
          rm -rf /tmp/alire /tmp/alire.zip
          alr --version

      - name: Select Ada toolchain
        run: |
          alr -n --force toolchain --select \
            gnat_native=16.1.0 \
            gprbuild=26.0.1
          alr toolchain

      - name: Run test suite
        run: alr -C tests run

  alire-ubuntu-lts:
    name: Alire Ubuntu LTS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Alire
        env:
          ALIRE_VERSION: "2.1.1"
        run: |
          curl -L \
            -o /tmp/alire.zip \
            "https://github.com/alire-project/alire/releases/download/v${ALIRE_VERSION}/alr-${ALIRE_VERSION}-bin-x86_64-linux.zip"
          unzip /tmp/alire.zip -d /tmp/alire
          mkdir -p "$PWD/alire_install/bin"
          install -m 0755 /tmp/alire/bin/alr "$PWD/alire_install/bin/alr"
          rm -rf /tmp/alire /tmp/alire.zip
          "$PWD/alire_install/bin/alr" version

      - name: Pull Alire Ubuntu LTS image
        run: docker pull ghcr.io/alire-project/docker/gnat:ubuntu-lts

      - name: Run test suite in Alire Ubuntu LTS image
        run: |
          docker run --rm \
            -e DEBIAN_FRONTEND=noninteractive \
            -v "$PWD:/workspace" \
            -v "$PWD/alire_install/bin/alr:/usr/bin/alr:ro" \
            -w /workspace \
            ghcr.io/alire-project/docker/gnat:ubuntu-lts \
            /bin/bash -c '
              set -eu

              echo "=== Environment ==="
              cat /etc/os-release
              uname -a
              uname -m

              gcc --version || true
              g++ --version || true
              gnat --version || true
              gprbuild --version || true
              pkg-config --version || echo "pkg-config is not installed yet"

              echo "=== Alire ==="
              command -v alr
              alr version

              echo "=== Install OpenCV development package ==="
              apt-get update
              apt-get install -y --no-install-recommends \
                libopencv-dev \
                pkg-config

              echo "=== OpenCV pkg-config ==="
              pkg-config --version
              if pkg-config --exists opencv5; then
                opencv_pkg=opencv5
              elif pkg-config --exists opencv4; then
                opencv_pkg=opencv4
              elif pkg-config --exists opencv; then
                opencv_pkg=opencv
              else
                echo "error: no OpenCV pkg-config package found" >&2
                exit 1
              fi
              echo "OpenCV pkg-config package: ${opencv_pkg}"
              pkg-config --modversion "${opencv_pkg}"
              pkg-config --cflags "${opencv_pkg}"
              pkg-config --libs "${opencv_pkg}"

              echo "=== Select Alire toolchain ==="
              alr -n --force toolchain --select \
                gnat_native=16.1.0 \
                gprbuild=26.0.1
              alr toolchain

              echo "=== Compiler visible inside Alire environment ==="
              alr exec -- which gnat
              alr exec -- gnat --version
              alr exec -- which gprbuild
              alr exec -- gprbuild --version

              echo "=== Build and test ==="
              alr -n build
              alr -n -C tests run
            '

  alire-fedora-latest:
    name: Alire Fedora Latest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Alire
        env:
          ALIRE_VERSION: "2.1.1"
        run: |
          curl -L \
            -o /tmp/alire.zip \
            "https://github.com/alire-project/alire/releases/download/v${ALIRE_VERSION}/alr-${ALIRE_VERSION}-bin-x86_64-linux.zip"
          unzip /tmp/alire.zip -d /tmp/alire
          mkdir -p "$PWD/alire_install/bin"
          install -m 0755 /tmp/alire/bin/alr "$PWD/alire_install/bin/alr"
          rm -rf /tmp/alire /tmp/alire.zip
          "$PWD/alire_install/bin/alr" version

      - name: Pull Alire Fedora Latest image
        run: docker pull ghcr.io/alire-project/docker/gnat:fedora-latest

      - name: Run test suite in Alire Fedora Latest image
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -v "$PWD/alire_install/bin/alr:/usr/bin/alr:ro" \
            -w /workspace \
            ghcr.io/alire-project/docker/gnat:fedora-latest \
            /bin/bash -c '
              set -eu

              git config --global --add safe.directory /workspace

              echo "=== Source being tested ==="
              git rev-parse HEAD
              git log -1 --oneline
              grep -n -A5 -B2 "Library_Type" opencv_core.gpr

              echo "=== Environment ==="
              cat /etc/os-release
              uname -a
              uname -m

              gcc --version || true
              g++ --version || true
              gnat --version || true
              gprbuild --version || true

              echo "=== Alire ==="
              command -v alr
              alr version

              echo "=== Install OpenCV development package ==="
              dnf install -y \
                opencv-devel \
                pkgconf-pkg-config \
                git

              echo "=== OpenCV pkg-config ==="
              pkg-config --version
              if pkg-config --exists opencv5; then
                opencv_pkg=opencv5
              elif pkg-config --exists opencv4; then
                opencv_pkg=opencv4
              elif pkg-config --exists opencv; then
                opencv_pkg=opencv
              else
                echo "error: no OpenCV pkg-config package found" >&2
                exit 1
              fi
              echo "OpenCV pkg-config package: ${opencv_pkg}"
              pkg-config --modversion "${opencv_pkg}"
              pkg-config --cflags "${opencv_pkg}"
              pkg-config --libs "${opencv_pkg}"

              echo "=== Select Alire toolchain ==="
              alr -n --force toolchain --select \
                gnat_native=16.1.0 \
                gprbuild=26.0.1
              alr toolchain

              echo "=== Compiler visible inside Alire environment ==="
              alr exec -- which gnat
              alr exec -- gnat --version
              alr exec -- which gprbuild
              alr exec -- gprbuild --version

              echo "=== Build ==="
              alr -n build

              echo "=== PIC diagnostic ==="
              shim_obj=$(find . -name opencv_core_shim.o | head -n 1 || true)
              if [ -n "${shim_obj}" ]; then
                echo "Found: ${shim_obj}"
                file "${shim_obj}"
                readelf -h "${shim_obj}" | grep -E "Class:|Data:|Type:|Machine:" || true
                readelf -rW "${shim_obj}" | grep -E "R_X86_64_32|R_X86_64_32S|R_X86_64_PC32" || true
              else
                echo "opencv_core_shim.o not found"
              fi

              echo "=== Test ==="
              alr -n -C tests run
            '

  macos-arm64:
    name: OpenCV macOS ARM64
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Report source and runner
        run: |
          set -eu
          echo "=== Source being tested ==="
          git rev-parse HEAD
          git log -1 --oneline
          echo "=== Runner ==="
          uname -a
          uname -m
          sw_vers

      - name: Set up Alire
        uses: alire-project/setup-alire@latest
        with:
          version: "2.1.1"
          toolchain: "gnat_native gprbuild"

      - name: Select and prove Ada toolchain
        run: |
          set -eu
          alr -n --force toolchain --select \
            gnat_native=16.1.0 \
            gprbuild=26.0.1

          echo "=== Alire ==="
          alr version
          alr toolchain

          echo "=== Compiler visible inside Alire environment ==="
          alr exec -- which gnat
          alr exec -- gnat --version
          alr exec -- which gprbuild
          alr exec -- gprbuild --version

          echo "=== C++ compiler inside Alire environment ==="
          alr exec -- which g++ || true
          alr exec -- g++ --version || true

          echo "=== Apple clang++ ==="
          xcrun --find clang++ || true
          xcrun clang++ --version || true

      - name: Install Homebrew OpenCV
        run: |
          set -eu
          brew install opencv

          echo "=== Homebrew prefixes ==="
          brew --prefix
          brew --prefix opencv

          echo "=== Homebrew OpenCV info ==="
          brew info opencv

      - name: Report Homebrew OpenCV and pkg-config
        run: |
          set -eu
          opencv_prefix="$(brew --prefix opencv)"
          brew_pkgconfig="$(brew --prefix)/lib/pkgconfig"
          opencv_pkgconfig="${opencv_prefix}/lib/pkgconfig"

          if [ -d "${brew_pkgconfig}" ]; then
            export PKG_CONFIG_PATH="${brew_pkgconfig}${PKG_CONFIG_PATH:+:${PKG_CONFIG_PATH}}"
          fi
          if [ -d "${opencv_pkgconfig}" ]; then
            export PKG_CONFIG_PATH="${opencv_pkgconfig}${PKG_CONFIG_PATH:+:${PKG_CONFIG_PATH}}"
          fi

          echo "PKG_CONFIG_PATH=${PKG_CONFIG_PATH:-}"
          echo "PKG_CONFIG_PATH=${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"

          echo "=== pkg-config ==="
          pkg-config --version

          if pkg-config --exists opencv5; then
            opencv_pkg=opencv5
          elif pkg-config --exists opencv4; then
            opencv_pkg=opencv4
          elif pkg-config --exists opencv; then
            opencv_pkg=opencv
          else
            echo "error: no OpenCV pkg-config package found" >&2
            echo "tried opencv5, opencv4, opencv" >&2
            pkg-config --list-all | grep -i opencv || true
            exit 1
          fi

          echo "selected OpenCV pkg-config package: ${opencv_pkg}"
          echo "OPENCV_PKG=${opencv_pkg}" >> "$GITHUB_ENV"
          pkg-config --modversion "${opencv_pkg}"
          pkg-config --cflags "${opencv_pkg}"
          pkg-config --libs "${opencv_pkg}"

          echo "=== Homebrew OpenCV libraries ==="
          ls -l "${opencv_prefix}/lib"

      - name: Inspect current project configuration
        run: |
          set -eu
          echo "=== opencv_core.gpr ==="
          cat opencv_core.gpr

          echo "=== Languages / library kind / C++ switches / linker options ==="
          grep -n -A8 -E 'Languages|Library_Type|Library_Kind|Default_Switches|"C\+\+"|Linker_Options|-lstdc\+\+' opencv_core.gpr

      - name: Build current source
        id: root-build
        continue-on-error: true
        run: |
          set -eu
          alr -n build

      - name: Capture C++ ABI evidence
        if: always()
        continue-on-error: true
        run: |
          set +e
          set +o pipefail
          opencv_prefix="$(brew --prefix opencv 2>/dev/null || true)"
          echo "=== Homebrew OpenCV core library ==="
          echo "opencv prefix: ${opencv_prefix}"

          core_lib=""
          for candidate in \
            "${opencv_prefix}/lib/libopencv_core.dylib" \
            "${opencv_prefix}/lib"/libopencv_core.*.dylib
          do
            if [ -e "${candidate}" ]; then
              core_lib="${candidate}"
              break
            fi
          done

          if [ -z "${core_lib}" ]; then
            echo "libopencv_core*.dylib not found under ${opencv_prefix}/lib"
            ls -l "${opencv_prefix}/lib" 2>/dev/null || true
          else
            echo "Found: ${core_lib}"
            ls -l "${core_lib}"
            file "${core_lib}"
            echo "=== otool -L ==="
            otool -L "${core_lib}"
            echo "=== lipo -info ==="
            lipo -info "${core_lib}" 2>/dev/null || true

            echo "=== nm FileStorage / FileNode (defined globals, nm -gU) ==="
            nm -gU "${core_lib}" 2>/dev/null | grep -E 'FileStorage|FileNode' | c++filt || true
            echo "=== nm FileStorage / FileNode (nm -g) ==="
            nm -g "${core_lib}" 2>/dev/null | grep -E 'FileStorage|FileNode' | c++filt || true
            echo "=== nm std string ABI spelling in FileStorage / FileNode ==="
            nm -g "${core_lib}" 2>/dev/null | grep -E 'FileStorage|FileNode' | grep -E '__cxx11|__1|basic_string' | c++filt || true
          fi

      - name: Inspect C++ shim object
        if: always()
        continue-on-error: true
        run: |
          set +e
          set +o pipefail
          echo "=== opencv_core_shim.o ==="
          shim_obj="$(find . -name opencv_core_shim.o | head -n 1)"
          if [ -z "${shim_obj}" ]; then
            echo "opencv_core_shim.o not found"
            find . -name '*shim*' -print | head -n 50
          else
            echo "Found: ${shim_obj}"
            ls -l "${shim_obj}"
            file "${shim_obj}"

            echo "=== nm undefined symbols (FileStorage / FileNode / basic_string) ==="
            nm -u "${shim_obj}" 2>/dev/null | grep -E 'FileStorage|FileNode|basic_string|__cxx11|__1' || true
            echo "=== nm all matching symbols ==="
            nm "${shim_obj}" 2>/dev/null | grep -E 'FileStorage|FileNode|basic_string|__cxx11|__1' || true
            echo "=== demangled matching symbols ==="
            nm "${shim_obj}" 2>/dev/null | grep -E 'FileStorage|FileNode|basic_string|__cxx11|__1' | c++filt || true

            echo "=== std::__cxx11 vs std::__1 references in shim object ==="
            echo "std::__cxx11 count: $(nm "${shim_obj}" 2>/dev/null | grep -c '__cxx11' || true)"
            echo "std::__1 count: $(nm "${shim_obj}" 2>/dev/null | grep -c '__1' || true)"
          fi

      - name: Capture actual build/link command
        if: ${{ always() && steps.root-build.outcome != 'success' }}
        continue-on-error: true
        run: |
          set +e
          echo "=== Verbose GPRbuild for failed root build ==="
          alr -n build -- -v

      - name: Run test suite
        id: tests
        if: ${{ always() && steps.root-build.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -eu
          alr -n -C tests run

      - name: Capture actual test build/link command
        if: ${{ always() && steps.tests.outcome == 'failure' }}
        continue-on-error: true
        run: |
          set +e
          echo "=== Verbose GPRbuild for failed tests crate ==="
          alr -n -C tests build -- -v

      - name: Discover mixed GNAT Ada + Apple clang++ configuration
        id: mixed-gprconfig
        if: always()
        continue-on-error: true
        run: |
          set -eu

          MIXED_CGPR="${RUNNER_TEMP}/opencv-macos-clang.cgpr"
          echo "MIXED_CGPR=${MIXED_CGPR}" >> "$GITHUB_ENV"

          echo "=== gprconfig version ==="
          alr exec -- gprconfig --version

          echo "=== gprconfig help ==="
          alr exec -- gprconfig --help || true

          echo "=== PATH inside Alire environment ==="
          alr exec -- printenv PATH

          echo "=== host PATH ==="
          printenv PATH || true

          echo "=== compilers visible to Alire ==="
          alr exec -- which gnat || true
          alr exec -- which gcc || true
          alr exec -- which g++ || true
          alr exec -- which clang++ || true
          alr exec -- which gprconfig || true

          echo "=== Apple clang++ ==="
          clang_pp="$(xcrun --find clang++)"
          echo "xcrun --find clang++: ${clang_pp}"
          xcrun clang++ --version
          clang_dir="$(dirname "${clang_pp}")"
          echo "clang++ directory: ${clang_dir}"
          echo "MIXED_CLANGXX=${clang_pp}" >> "$GITHUB_ENV"
          echo "MIXED_CLANG_DIR=${clang_dir}" >> "$GITHUB_ENV"

          echo "=== gprconfig known compilers ==="
          alr exec -- gprconfig --show-known-compilers || true

          echo "=== gprconfig discovered compilers ==="
          alr exec -- gprconfig --mi-show-compilers || true

          echo "=== generate mixed Ada GNAT + C++ CLANG-C++ configuration ==="
          echo "output: ${MIXED_CGPR}"
          echo "command:"
          echo "  alr exec -- gprconfig --batch \\"
          echo "    --config=language:ada \\"
          echo "    --config=language:c++,path:${clang_dir},name:CLANG-C++ \\"
          echo "    -o ${MIXED_CGPR}"

          alr exec -- gprconfig --batch \
            --config=language:ada \
            --config=language:c++,path:"${clang_dir}",name:CLANG-C++ \
            -o "${MIXED_CGPR}"

          if [ ! -f "${MIXED_CGPR}" ]; then
            echo "error: mixed configuration was not generated: ${MIXED_CGPR}" >&2
            exit 1
          fi

          echo "generated ${MIXED_CGPR}"
          ls -l "${MIXED_CGPR}"

      - name: Inspect generated mixed configuration
        if: ${{ always() && steps.mixed-gprconfig.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -eu
          MIXED_CGPR="${MIXED_CGPR:-${RUNNER_TEMP}/opencv-macos-clang.cgpr}"

          echo "=== generated cgpr path ==="
          ls -l "${MIXED_CGPR}"

          echo "=== Compiler / Binder / Linker excerpts ==="
          grep -n -E \
            'package Compiler|package Binder|package Linker|for Driver|Leading_Required_Switches|Required_Switches|Shared_Library_Minimum_Switches|Bindfile_Option_Substitution|Library_Encapsulated_Options' \
            "${MIXED_CGPR}" || true

          echo "=== GCC-specific switches in generated cgpr ==="
          echo "-specs= count: $(grep -c -- '-specs=' "${MIXED_CGPR}" || true)"
          echo "-static-libgcc count: $(grep -c -- '-static-libgcc' "${MIXED_CGPR}" || true)"
          echo "-shared-libgcc count: $(grep -c -- '-shared-libgcc' "${MIXED_CGPR}" || true)"
          grep -n -E -- '-specs=|-static-libgcc|-shared-libgcc' "${MIXED_CGPR}" || true

          echo "=== Driver assignments ==="
          grep -n -E 'for Driver' "${MIXED_CGPR}" || true

          echo "=== generated cgpr line count ==="
          wc -l "${MIXED_CGPR}"

          echo "=== generated cgpr (complete) ==="
          cat "${MIXED_CGPR}"

      - name: Experimental mixed-configuration root build
        id: mixed-root-build
        if: ${{ always() && steps.mixed-gprconfig.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -eu
          MIXED_CGPR="${MIXED_CGPR:-${RUNNER_TEMP}/opencv-macos-clang.cgpr}"

          echo "=== clean library build artifacts for mixed recompile ==="
          rm -rf obj lib

          echo "=== mixed root build ==="
          echo "alr -n build -- --config=${MIXED_CGPR} -v"
          mixed_root_log="${RUNNER_TEMP}/mixed-root-build.log"
          set +e
          alr -n build -- --config="${MIXED_CGPR}" -v 2>&1 | tee "${mixed_root_log}"
          status="${PIPESTATUS[0]}"
          set -e

          echo "=== compiler invocations involving opencv_core_shim.cpp ==="
          grep -E 'opencv_core_shim\.cpp|clang\+\+|/g\+\+' "${mixed_root_log}" || true

          echo "=== GCC-only switches on mixed root build command lines ==="
          grep -n -E -- '-specs=|-static-libgcc|-shared-libgcc' "${mixed_root_log}" || true

          exit "${status}"

      - name: Inspect mixed-build C++ shim object
        if: ${{ always() && steps.mixed-root-build.outcome != 'skipped' }}
        continue-on-error: true
        run: |
          set +e
          set +o pipefail

          echo "=== mixed-build opencv_core_shim.o ==="
          shim_obj="$(find . -name opencv_core_shim.o | head -n 1)"
          if [ -z "${shim_obj}" ]; then
            echo "opencv_core_shim.o not found after mixed root build"
            find . -name '*shim*' -print | head -n 50
            exit 0
          fi

          echo "Found: ${shim_obj}"
          ls -l "${shim_obj}"
          file "${shim_obj}"

          echo "=== nm undefined symbols (FileStorage / FileNode / error / basic_string) ==="
          nm -u "${shim_obj}" 2>/dev/null | grep -E 'FileStorage|FileNode|basic_string|__cxx11|__1|error' || true
          echo "=== nm all matching symbols ==="
          nm "${shim_obj}" 2>/dev/null | grep -E 'FileStorage|FileNode|basic_string|__cxx11|__1|cv::error|error' || true
          echo "=== demangled matching symbols ==="
          nm "${shim_obj}" 2>/dev/null | grep -E 'FileStorage|FileNode|basic_string|__cxx11|__1' | c++filt || true

          echo "=== mixed-build std::__cxx11 vs std::__1 ==="
          echo "std::__cxx11 count: $(nm "${shim_obj}" 2>/dev/null | grep -c '__cxx11' || true)"
          echo "std::__1 count: $(nm "${shim_obj}" 2>/dev/null | grep -c '__1' || true)"

      - name: Experimental mixed-configuration tests build and run
        id: mixed-tests
        if: ${{ always() && steps.mixed-root-build.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -eu
          MIXED_CGPR="${MIXED_CGPR:-${RUNNER_TEMP}/opencv-macos-clang.cgpr}"

          echo "=== clean tests build artifacts for mixed link ==="
          rm -rf tests/obj tests/bin

          echo "=== mixed tests build ==="
          echo "alr -n -C tests build -- --config=${MIXED_CGPR} -v"
          mixed_tests_log="${RUNNER_TEMP}/mixed-tests-build.log"
          set +e
          alr -n -C tests build -- --config="${MIXED_CGPR}" -v 2>&1 | tee "${mixed_tests_log}"
          status="${PIPESTATUS[0]}"
          set -e

          echo "=== linker / compiler invocations from mixed tests build ==="
          grep -E 'clang\+\+|/g\+\+| -o |libstdc\+\+|libc\+\+' "${mixed_tests_log}" || true

          echo "=== GCC-only and C++ runtime switches on mixed tests build ==="
          grep -n -E -- '-specs=|-static-libgcc|-shared-libgcc|-lstdc\+\+|-lc\+\+' "${mixed_tests_log}" || true

          if [ "${status}" -ne 0 ]; then
            exit "${status}"
          fi

          echo "=== mixed tests run ==="
          echo "alr -n -C tests run --skip-build"
          alr -n -C tests run --skip-build

      - name: Inspect mixed-build test executable
        if: ${{ always() && steps.mixed-tests.outcome != 'skipped' }}
        continue-on-error: true
        run: |
          set +e
          set +o pipefail

          echo "=== mixed-build test executable ==="
          test_exe=""
          for candidate in tests/bin/tests tests/bin/test; do
            if [ -e "${candidate}" ]; then
              test_exe="${candidate}"
              break
            fi
          done
          if [ -z "${test_exe}" ]; then
            test_exe="$(find tests/bin -type f -perm -111 2>/dev/null | head -n 1)"
          fi

          if [ -z "${test_exe}" ]; then
            echo "mixed-build test executable not found"
            ls -l tests/bin 2>/dev/null || true
            find tests -name 'tests' -print | head -n 20
            exit 0
          fi

          echo "Found: ${test_exe}"
          ls -l "${test_exe}"
          file "${test_exe}"

          echo "=== otool -L ==="
          otool -L "${test_exe}"

          echo "=== libc++ vs libstdc++ ==="
          echo "libc++ lines:"
          otool -L "${test_exe}" | grep -E 'libc\+\+' || true
          echo "libstdc++ lines:"
          otool -L "${test_exe}" | grep -E 'libstdc\+\+' || true

      - name: Report mixed-configuration experiment outcomes
        if: always()
        run: |
          echo "mixed-gprconfig outcome: ${{ steps.mixed-gprconfig.outcome }}"
          echo "mixed-root-build outcome: ${{ steps.mixed-root-build.outcome }}"
          echo "mixed-tests outcome: ${{ steps.mixed-tests.outcome }}"
          echo "baseline root-build outcome: ${{ steps.root-build.outcome }}"
          echo "baseline tests outcome: ${{ steps.tests.outcome }}"

      - name: Fail job if build or tests failed
        if: ${{ always() && (steps.root-build.outcome != 'success' || steps.tests.outcome == 'failure') }}
        run: |
          echo "macOS ARM64 compatibility job failed."
          echo "root-build outcome: ${{ steps.root-build.outcome }}"
          echo "tests outcome: ${{ steps.tests.outcome }}"
          echo "mixed-gprconfig outcome: ${{ steps.mixed-gprconfig.outcome }}"
          echo "mixed-root-build outcome: ${{ steps.mixed-root-build.outcome }}"
          echo "mixed-tests outcome: ${{ steps.mixed-tests.outcome }}"
          exit 1


