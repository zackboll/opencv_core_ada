name: Ada API Documentation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Serialize main publication; cancel superseded runs before they can deploy.
concurrency:
  group: documentation-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install native prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libopencv-dev pkg-config unzip python3 python3-venv
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Alire 2.1.1
        run: |
          curl --fail --location --output /tmp/alire.zip https://github.com/alire-project/alire/releases/download/v2.1.1/alr-2.1.1-bin-x86_64-linux.zip
          unzip /tmp/alire.zip -d /tmp/alire
          sudo install -m 0755 /tmp/alire/bin/alr /usr/local/bin/alr
      - name: Select qualified compiler and project tools
        run: |
          alr -n --force toolchain --select gnat_native=16.1.0 gprbuild=26.0.1
          alr toolchain
      - name: Install checksum-qualified released documentation toolkit
        run: |
          sh scripts/install_doc_enhancer.sh
          python -m unittest discover -s scripts -p 'test_install_doc_enhancer.py' -v
          echo "DOC_PYTHON=$GITHUB_WORKSPACE/.doc-tools/enhancer/bin/python" >> "$GITHUB_ENV"
      - name: Record exact source and protected identities
        run: |
          mkdir -p obj/docs
          test "$(git rev-parse HEAD)" = '${{ github.event.pull_request.head.sha || github.sha }}'
          git rev-parse HEAD 'HEAD^{tree}' > obj/docs/git-identities.txt
          git ls-tree HEAD src cpp alire.toml opencv_core.gpr opencv_core_shim.gpr tests docs_api.gpr docs_internal.gpr > obj/docs/protected-before.txt
      - name: Test warning comparison
        run: '"$DOC_PYTHON" -m unittest discover -s scripts -p ''test_compare_gnatdoc_warnings.py'' -v'
      - name: Test type cross-references
        run: '"$DOC_PYTHON" -m unittest discover -s scripts -p ''test_link_gnatdoc_types.py'' -v'
      - name: Test theme and Ada highlighting integrity
        run: '"$DOC_PYTHON" -m unittest discover -s scripts -p ''test_highlight_gnatdoc_ada.py'' -v'
      - name: Test generic instance integrity
        run: '"$DOC_PYTHON" -m unittest discover -s scripts -p ''test_gnatdoc_instances.py'' -v'
      - name: Generate and validate public API
        run: sh scripts/generate_docs.sh
      - name: Qualify published guide integrity
        run: '"$DOC_PYTHON" -m unittest discover -s scripts -p ''test_gnatdoc_guides.py'' -v'
      - name: Qualify deterministic fresh generation
        run: |
          cp -a _site /tmp/documentation-first
          cp -a obj/docs/native /tmp/documentation-native-first
          sh scripts/generate_docs.sh
          diff -r /tmp/documentation-native-first obj/docs/native
          diff -r /tmp/documentation-first _site
          .doc-tools/enhancer/bin/gnatdoc-enhancer enhance --source-root obj/docs/enhancer-input --config docs/gnatdoc-enhancer.toml --site "$GITHUB_WORKSPACE/_site"
          diff -r /tmp/documentation-first _site
          .doc-tools/enhancer/bin/gnatdoc-enhancer verify --source-root obj/docs/enhancer-input --config docs/gnatdoc-enhancer.toml --site "$GITHUB_WORKSPACE/_site"
          "$DOC_PYTHON" scripts/validate_docs.py _site
      - name: Qualify generated generic instance pages
        run: '"$DOC_PYTHON" -m unittest discover -s scripts -p ''test_gnatdoc_instances.py'' -v'
      - name: Qualify native navigation integrity
        run: '"$DOC_PYTHON" -m unittest discover -s scripts -p ''test_gnatdoc_navigation.py'' -v'
      - name: Qualify independent publication and acquisition rejection
        run: '"$DOC_PYTHON" -m unittest discover -s scripts -p ''test_core_enhancer.py'' -v'
      - name: Qualify independent Ada examples and security mutations
        run: '"$DOC_PYTHON" -m unittest discover -s scripts -p ''test_core_examples.py'' -v'
      - name: Qualify immutable compiler-map selection and input rejection
        run: '"$DOC_PYTHON" -m unittest discover -s scripts -p ''test_core_verified_examples.py'' -v'
      - name: Run complete Core documentation Python regression suite
        run: '"$DOC_PYTHON" -m unittest discover -s scripts -p ''test_*.py'' -v'
      - name: Acquire authenticated historical publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sh scripts/acquire_core_doc_baseline.sh
          "$DOC_PYTHON" scripts/acquire_core_doc_v014.py
          "$DOC_PYTHON" scripts/compare_core_doc_examples.py
      - name: Qualify real-browser package and declaration navigation
        run: |
          npm install --prefix /tmp/doc-browser --no-package-lock playwright@1.64.1
          /tmp/doc-browser/node_modules/.bin/playwright install --with-deps chromium
          export PLAYWRIGHT_MODULE=/tmp/doc-browser/node_modules/playwright
          export CHROME=$(node -e 'console.log(require(process.env.PLAYWRIGHT_MODULE).chromium.executablePath())')
          export DOC_URL=http://127.0.0.1:8071/api/index.html
          export DOC_EVIDENCE="$GITHUB_WORKSPACE/obj/docs/browser-screenshots"
          python3 -m http.server 8071 --bind 127.0.0.1 --directory _site &
          server=$!
          python3 -m http.server 8073 --bind 127.0.0.1 --directory obj/docs/historical/publication &
          historical=$!
          trap 'kill "$server" "$historical"' EXIT
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 "$DOC_URL" --output /dev/null
          node scripts/test_gnatdoc_navigation_browser.cjs
          node scripts/test_gnatdoc_symbols_browser.cjs
          node scripts/test_gnatdoc_search_browser.cjs
          node scripts/test_gnatdoc_cross_origin_browser.cjs
          "$DOC_PYTHON" scripts/gnatdoc_browser_oracle.py
          node scripts/test_gnatdoc_migration_browser.cjs
          DOC_URL=http://127.0.0.1:8071/ DOC_BEFORE_URL=http://127.0.0.1:8073/ node scripts/test_gnatdoc_landing_browser.cjs
          DOC_URL=http://127.0.0.1:8071/ node scripts/test_gnatdoc_guides_browser.cjs
          DOC_URL=http://127.0.0.1:8071/ node scripts/test_gnatdoc_examples_browser.cjs
      - name: Verify source and production integrity
        run: |
          git diff --exit-code
          git ls-tree HEAD src cpp alire.toml opencv_core.gpr opencv_core_shim.gpr tests docs_api.gpr docs_internal.gpr > obj/docs/protected-after.txt
          diff obj/docs/protected-before.txt obj/docs/protected-after.txt
          "$DOC_PYTHON" scripts/verify_core_enhancer.py --native obj/docs/native
      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: ada-api-${{ github.event.pull_request.head.sha || github.sha }}
          path: _site/
          if-no-files-found: error
      - name: Upload generator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gnatdoc-diagnostics-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            obj/docs/*.log
            obj/docs/*.json
            obj/docs/*.txt
            obj/docs/native/
            obj/docs/browser-screenshots/
            obj/docs/historical/run.json
            obj/docs/historical/artifact.json
            obj/docs/v014/run.json
            obj/docs/v014/artifact.json
            .doc-tools/enhancer-release/SHA256SUMS
            .doc-tools/enhancer-release/release-provenance.json
      - name: Configure Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/
          # Keep deployment evidence available for follow-up audits (default is 1 day).
          retention-days: 30

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4